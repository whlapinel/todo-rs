<!-- The #day-drawer dialog's innerHTML (see calendar_page.html) — rendered wholesale on every
     swap (day-cell click, or this fragment's own prev/next-day arrows below), not just an inner
     content div, since the sliding-panel transition classes (`group-open/dialog:translate-x-0`
     etc.) need to be present on every swap, not just the first. `data-date` on the outer wrapper
     is base.html's hook for the client-side selected-day-highlight listener — it never re-fetches
     or re-renders the month grid itself, just toggles which grid cell (matched by its own
     `data-date`, calendar_page.html) carries the ring-highlight classes. -->
{% if let Some(drawer) = drawer %}
<div data-date="{{ drawer.date_iso }}">
  <div class="fixed inset-0 bg-gray-500/75 dark:bg-gray-900/50 transition-opacity duration-300 ease-out opacity-0 group-open/dialog:opacity-100"
    onclick="document.getElementById('day-drawer').close()"></div>
  <div class="fixed inset-y-0 right-0 flex max-w-full pl-10">
    <div class="w-screen max-w-md transform transition duration-300 ease-in-out translate-x-full group-open/dialog:translate-x-0">
      <div class="flex h-full flex-col overflow-y-auto bg-white shadow-xl dark:bg-gray-800 dark:after:absolute dark:after:inset-y-0 dark:after:left-0 dark:after:w-px dark:after:bg-white/10">
        <div class="border-b border-gray-200 p-6 dark:border-white/10">
          <div class="flex items-start justify-between gap-3">
            <div class="flex items-center gap-x-1">
              <a href="/web/projects/{{ project_id }}/dashboard/calendar?year={{ drawer.prev_year }}&month={{ drawer.prev_month }}&date={{ drawer.prev_date }}&type={{ drawer.active_type }}{% if drawer.assigned_to_any %}&assignedToAny=1{% endif %}"
                hx-get="/web/projects/{{ project_id }}/dashboard/calendar/day?date={{ drawer.prev_date }}&type={{ drawer.active_type }}{% if drawer.assigned_to_any %}&assignedToAny=1{% endif %}"
                hx-target="#day-drawer" hx-select="unset" hx-swap="innerHTML"
                hx-push-url="/web/projects/{{ project_id }}/dashboard/calendar?year={{ drawer.prev_year }}&month={{ drawer.prev_month }}&date={{ drawer.prev_date }}&type={{ drawer.active_type }}{% if drawer.assigned_to_any %}&assignedToAny=1{% endif %}"
                class="flex h-8 w-8 items-center justify-center rounded-md text-gray-400 hover:bg-gray-100 hover:text-gray-500 dark:hover:bg-white/10 dark:hover:text-white">
                <span class="sr-only">Previous day</span>
                <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" class="size-5">
                  <path fill-rule="evenodd" clip-rule="evenodd" d="M11.78 5.22a.75.75 0 0 1 0 1.06L8.06 10l3.72 3.72a.75.75 0 1 1-1.06 1.06l-4.25-4.25a.75.75 0 0 1 0-1.06l4.25-4.25a.75.75 0 0 1 1.06 0Z" />
                </svg>
              </a>
              <h2 id="day-drawer-title" class="px-1 text-base font-semibold text-gray-900 dark:text-white">
                {{ drawer.selected_date_label }}</h2>
              <a href="/web/projects/{{ project_id }}/dashboard/calendar?year={{ drawer.next_year }}&month={{ drawer.next_month }}&date={{ drawer.next_date }}&type={{ drawer.active_type }}{% if drawer.assigned_to_any %}&assignedToAny=1{% endif %}"
                hx-get="/web/projects/{{ project_id }}/dashboard/calendar/day?date={{ drawer.next_date }}&type={{ drawer.active_type }}{% if drawer.assigned_to_any %}&assignedToAny=1{% endif %}"
                hx-target="#day-drawer" hx-select="unset" hx-swap="innerHTML"
                hx-push-url="/web/projects/{{ project_id }}/dashboard/calendar?year={{ drawer.next_year }}&month={{ drawer.next_month }}&date={{ drawer.next_date }}&type={{ drawer.active_type }}{% if drawer.assigned_to_any %}&assignedToAny=1{% endif %}"
                class="flex h-8 w-8 items-center justify-center rounded-md text-gray-400 hover:bg-gray-100 hover:text-gray-500 dark:hover:bg-white/10 dark:hover:text-white">
                <span class="sr-only">Next day</span>
                <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" class="size-5">
                  <path fill-rule="evenodd" clip-rule="evenodd" d="M8.22 5.22a.75.75 0 0 1 1.06 0l4.25 4.25a.75.75 0 0 1 0 1.06l-4.25 4.25a.75.75 0 0 1-1.06-1.06L11.94 10 8.22 6.28a.75.75 0 0 1 0-1.06Z" />
                </svg>
              </a>
            </div>
            <button type="button" onclick="document.getElementById('day-drawer').close()"
              class="relative shrink-0 rounded-md text-gray-400 hover:text-gray-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600 dark:hover:text-white dark:focus-visible:outline-indigo-500">
              <span class="sr-only">Close panel</span>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true" class="size-6">
                <path d="M6 18 18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </button>
          </div>
          <!-- Stage 3: All/Tasks/Events tabs. Each hx-gets the same day-fragment route with an
               added `type` param, but targets/selects only #day-drawer-list below (matching the
               `#item-{id}-view`/outerHTML precedent elsewhere in this app) — the header above
               (date label, arrows) is never re-fetched by a tab click, only the month grid's own
               "never re-render" guarantee is stricter (see docs/calendar-day-drawer-plan.md's
               "Confirmed design decisions": only the assigned-to-me toggle reloads the whole
               page). `assignedToAny` is carried forward from `drawer.assigned_to_any` so a tab
               switch never silently drops the current mine/everyone filter. -->
          <nav class="mt-4 -mb-px flex gap-x-6 text-sm font-medium" aria-label="Item type">
            <a href="/web/projects/{{ project_id }}/dashboard/calendar?year={{ drawer.date_year }}&month={{ drawer.date_month }}&date={{ drawer.date_iso }}&type=all{% if drawer.assigned_to_any %}&assignedToAny=1{% endif %}"
              hx-get="/web/projects/{{ project_id }}/dashboard/calendar/day?date={{ drawer.date_iso }}&type=all{% if drawer.assigned_to_any %}&assignedToAny=1{% endif %}"
              hx-target="#day-drawer-list" hx-select="#day-drawer-list" hx-swap="outerHTML"
              hx-push-url="/web/projects/{{ project_id }}/dashboard/calendar?year={{ drawer.date_year }}&month={{ drawer.date_month }}&date={{ drawer.date_iso }}&type=all{% if drawer.assigned_to_any %}&assignedToAny=1{% endif %}"
              class="border-b-2 pb-2 {% if drawer.active_type == "all" %}border-indigo-500 text-indigo-600 dark:border-indigo-400 dark:text-indigo-400{% else %}border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-300{% endif %}">All</a>
            <a href="/web/projects/{{ project_id }}/dashboard/calendar?year={{ drawer.date_year }}&month={{ drawer.date_month }}&date={{ drawer.date_iso }}&type=task{% if drawer.assigned_to_any %}&assignedToAny=1{% endif %}"
              hx-get="/web/projects/{{ project_id }}/dashboard/calendar/day?date={{ drawer.date_iso }}&type=task{% if drawer.assigned_to_any %}&assignedToAny=1{% endif %}"
              hx-target="#day-drawer-list" hx-select="#day-drawer-list" hx-swap="outerHTML"
              hx-push-url="/web/projects/{{ project_id }}/dashboard/calendar?year={{ drawer.date_year }}&month={{ drawer.date_month }}&date={{ drawer.date_iso }}&type=task{% if drawer.assigned_to_any %}&assignedToAny=1{% endif %}"
              class="border-b-2 pb-2 {% if drawer.active_type == "task" %}border-indigo-500 text-indigo-600 dark:border-indigo-400 dark:text-indigo-400{% else %}border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-300{% endif %}">Tasks</a>
            <a href="/web/projects/{{ project_id }}/dashboard/calendar?year={{ drawer.date_year }}&month={{ drawer.date_month }}&date={{ drawer.date_iso }}&type=event{% if drawer.assigned_to_any %}&assignedToAny=1{% endif %}"
              hx-get="/web/projects/{{ project_id }}/dashboard/calendar/day?date={{ drawer.date_iso }}&type=event{% if drawer.assigned_to_any %}&assignedToAny=1{% endif %}"
              hx-target="#day-drawer-list" hx-select="#day-drawer-list" hx-swap="outerHTML"
              hx-push-url="/web/projects/{{ project_id }}/dashboard/calendar?year={{ drawer.date_year }}&month={{ drawer.date_month }}&date={{ drawer.date_iso }}&type=event{% if drawer.assigned_to_any %}&assignedToAny=1{% endif %}"
              class="border-b-2 pb-2 {% if drawer.active_type == "event" %}border-indigo-500 text-indigo-600 dark:border-indigo-400 dark:text-indigo-400{% else %}border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-300{% endif %}">Events</a>
          </nav>
        </div>
        <div id="day-drawer-list" class="flex-1 overflow-y-auto px-6 py-4">
          <ul class="divide-y divide-gray-100 dark:divide-white/5">
            {% if day_rows.is_empty() %}
            <li class="py-3 text-sm text-gray-500 dark:text-gray-400">Nothing due or scheduled this day.</li>
            {% else %}
            {% for row in day_rows %}
            {{ row|safe }}
            {% endfor %}
            {% endif %}
          </ul>
        </div>
      </div>
    </div>
  </div>
</div>
{% endif %}
