<li id="proj-dash-virtual-{{ series_id }}-{{ occurrence_ts }}" class="py-2">
  <div class="flex items-center gap-x-3">
    <span class="shrink-0 size-4"></span>
    <span
      class="shrink-0 inline-flex size-4 items-center justify-center rounded-full bg-gray-200 text-[10px] font-semibold text-gray-600 dark:bg-white/10 dark:text-gray-300"
      title="{{ title }}">{{ type_symbol }}</span>
    {% if is_skipped %}
    <span class="min-w-0 flex-1 truncate italic line-through text-gray-400 dark:text-gray-500">{{ name }}</span>
    <span class="shrink-0 text-[10px] uppercase tracking-wide font-semibold text-gray-400 dark:text-gray-500">Skipped</span>
    {% else %}
    <a href="#" hx-post="{{ materialize_url }}" hx-target="#page" hx-select="#page" hx-swap="innerHTML"
      class="min-w-0 flex-1 truncate italic text-gray-500 dark:text-gray-400">{{ name }}</a>
    {% if is_current %}
    <span
      class="shrink-0 text-[10px] uppercase tracking-wide font-semibold text-indigo-600 dark:text-indigo-400">Current</span>
    {% else %}
    <span class="shrink-0 text-[10px] uppercase tracking-wide text-gray-400 dark:text-gray-500">Planned</span>
    {% endif %}
    {% endif %}
  </div>
  <div class="mt-1 flex items-center gap-x-3 pl-7 text-xs text-gray-500 dark:text-gray-400">
    {% if let Some(a) = assignee_name %}<span class="text-indigo-600 dark:text-indigo-400">{{ a }}</span>{% endif %}
    <span class="flex-1">{{ date_kind_label }}: {{ date_label }}</span>
    {% if is_skipped %}
    <button hx-post="{{ unskip_url }}"
      class="shrink-0 cursor-pointer text-gray-400 hover:text-indigo-500 dark:text-gray-500 dark:hover:text-indigo-400">Unskip</button>
    {% else %}
    <button hx-post="{{ skip_url }}" hx-confirm="Skip this occurrence?"
      class="shrink-0 cursor-pointer text-gray-400 hover:text-red-500 dark:text-gray-500 dark:hover:text-red-400">Skip</button>
    {% endif %}
  </div>
</li>
