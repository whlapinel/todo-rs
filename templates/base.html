<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Todo{% endblock %}</title>
  <link rel="stylesheet" href="/web/static/style.css" />
  <script>
    // Read before body paints so the desktop sidebar renders already-collapsed on load
    // when that's the stored preference — applying the class after paint would cause a
    // visible layout shift (sidebar flashes open, then snaps shut).
    if (localStorage.getItem("sidebarCollapsed") === "1") {
      document.documentElement.classList.add("sidebar-collapsed");
    }
  </script>
  <script>
    // Fallback for the tzOffsetMinutes header (see the htmx:configRequest listener below):
    // that header only exists on htmx-issued requests, so a raw full-page load (bookmark,
    // hard refresh, typed URL) never carries one. This cookie, sent automatically on every
    // request including that first one, is what the server falls back to for those — see
    // TzOffset::from_request_parts in src/handlers/web_ui/mod.rs. Only a page's very first
    // load, before this has ever run once, is truly unavoidable (no cookie yet either).
    document.cookie = "tz_offset=" + new Date().getTimezoneOffset() + "; path=/; max-age=31536000; samesite=lax";
  </script>
</head>

<body class="bg-gray-50 text-gray-900 dark:bg-gray-900 dark:text-white" hx-boost="true" hx-target="#page"
  hx-select="#page" hx-swap="innerHTML">
  {% block header %}{{ nav_html|safe }}{% endblock %}

  <main id="page">
    <div class="max-w-7xl mx-auto px-4 py-8 sm:px-6 lg:px-8">
      {% block content %}{% endblock %}
    </div>
  </main>

  <!-- Always-present error-display target for htmx error responses. Sits outside #page so
       boosted navigation (which only swaps #page's innerHTML) never removes it. Row/checkbox
       actions target narrow ids like #item-{id} that don't exist in an ItemError's response
       body, so the server retargets error responses here via the HX-Retarget/HX-Reswap/
       HX-Reselect headers (see ItemError::into_response in src/web_ui/error.rs) instead of
       relying on the triggering element's own hx-target/hx-select. A persistent <dialog>,
       same shell as #action-dialog below (and auto-opened by the same htmx:afterSwap
       listener) — modal, requires the user to click OK to dismiss, rather than the old
       #error-toast div that auto-faded after 2.5s with nothing to acknowledge. Kept as its
       own dialog rather than reusing #action-dialog so an error surfaced while a row-action
       dialog is open (e.g. a rejected reschedule submit) stacks on top of it instead of
       clobbering the form the user was mid-filling. -->
  <dialog id="error-dialog"
    class="group/dialog fixed inset-0 size-auto max-h-none max-w-none overflow-y-auto bg-transparent backdrop:bg-transparent">
  </dialog>

  <script src="/web/static/js/htmx.min.js"></script>
  <script>
    // htmx defaults to *not* swapping 4xx/5xx response bodies into the DOM at all (it only
    // fires htmx:responseError). Every error this app returns (ItemError::into_response) is
    // meaningful HTML meant to be shown to the user, so swapping needs to be enabled for
    // those status codes too — the HX-Retarget/HX-Reswap/HX-Reselect headers on the response
    // itself (not hx-target/hx-select on the triggering element) decide where it lands.
    htmx.config.responseHandling = [
      { code: "204", swap: false },
      { code: "[23]..", swap: true },
      { code: "[45]..", swap: true, error: true },
    ];

    document.body.addEventListener("htmx:configRequest", function (evt) {
      evt.detail.headers["X-Tz-Offset-Minutes"] = new Date().getTimezoneOffset();
    });

    // A checkbox's native `checked` state flips the instant the user clicks it, before the
    // hx-put it triggers even reaches the server — a rejected request (e.g. completing an
    // unassigned team item) now shows its error in #error-dialog (above) rather than silently
    // vanishing, but the checkbox itself has no row/fields swap to revert it, since that swap
    // got retargeted to the dialog instead. Without this, a rejected completion would leave the
    // checkbox looking checked even though the item never actually completed.
    document.body.addEventListener("htmx:afterRequest", function (evt) {
      if (!evt.detail.successful && evt.detail.elt && evt.detail.elt.matches && evt.detail.elt.matches("input[type=checkbox]")) {
        evt.detail.elt.checked = !evt.detail.elt.checked;
      }
    });

    // Desktop-only sidebar collapse. #page never reserves space for the sidebar and never
    // changes on toggle — the sidebar (styles/input.css's #sidebar-desktop rules) is a
    // fixed-position overlay on its own stacking plane (z-30, above #page's implicit
    // z-auto) that slides via `transform`, not `width`/`padding`, so toggling can never
    // reflow #page's own box. On narrower desktop widths the expanded sidebar can overlap
    // #page's centered content — accepted deliberately in favor of zero layout shift.
    // Persisted to localStorage and re-applied synchronously in <head> (above) so a
    // fresh/non-boosted page load never flashes one state before the other.
    function toggleSidebar() {
      var collapsed = !document.documentElement.classList.contains("sidebar-collapsed");
      document.documentElement.classList.toggle("sidebar-collapsed", collapsed);
      localStorage.setItem("sidebarCollapsed", collapsed ? "1" : "0");
    }

    // #action-dialog (below) is a persistent <dialog> — only its innerHTML is swapped by
    // hx-get requests (row action buttons like the reschedule calendar icon), so the
    // element's own id survives across opens rather than being replaced by a fresh
    // response's root element. Guard on `!dialog.open` since showModal() throws if called
    // on an already-open dialog.
    document.addEventListener('htmx:afterSwap', (e) => {
      const dialog = e.detail.target.matches?.('dialog')
        ? e.detail.target
        : e.detail.target.querySelector?.('dialog');
      if (dialog && !dialog.open) dialog.showModal();
    });

    // A row's "⋮" button (components/row.html) calls this instead of hx-get-ing a menu from
    // the server: the row's own <template id="row-actions-menu-{id}"> (rendered by
    // components/row_actions_menu.html, right next to the button) already has every URL the
    // menu needs, so there's nothing a round trip would add. htmx.process() is required here
    // because htmx only auto-binds hx-* attributes on elements it swaps in itself (or that
    // were present at initial page load) — a plain innerHTML assignment like this one leaves
    // the menu's own Reschedule/Assign/Duplicate/Delete buttons inert without it.
    function openRowActionsMenu(rowId) {
      const tpl = document.getElementById('row-actions-menu-' + rowId);
      const dialog = document.getElementById('action-dialog');
      if (!tpl || !dialog) return;
      dialog.innerHTML = tpl.innerHTML;
      htmx.process(dialog);
      if (!dialog.open) dialog.showModal();
    }

    // The row-actions menu's Delete button (components/row_actions_menu.html) targets
    // #item-{id}, not #action-dialog, since deleting should also remove the row — so unlike
    // Reschedule/Assign/Duplicate (which swap #action-dialog's own content and therefore
    // don't need this), a successful delete leaves the dialog open over a page it no longer
    // has anything to say about. Closes it whenever the element that triggered a successful
    // request was inside an open #action-dialog and used hx-delete.
    document.body.addEventListener('htmx:afterRequest', function (evt) {
      var dialog = document.getElementById('action-dialog');
      var elt = evt.detail.elt;
      if (evt.detail.successful && dialog && dialog.open && elt &&
        elt.hasAttribute && elt.hasAttribute('hx-delete') && dialog.contains(elt)) {
        dialog.close();
      }
    });

    // Rows/fragments the server marks with data-dismiss-after="<ms>" (styles/input.css,
    // components/row.html) fade out and remove themselves that many ms after being swapped
    // in — e.g. a freshly-completed task row when "Show completed" is off, giving the user a
    // moment to see the success state before it leaves the list rather than vanishing the
    // instant the request completes. Scans the whole document rather than just the swap
    // target, since outerHTML swaps (the checkbox's own hx-swap) replace the target element
    // entirely and htmx:afterSwap's detail.target identity around that isn't reliable to
    // depend on; the dismissScheduled guard keeps this idempotent across the repeated scans.
    // Reusable by any row/fragment for any successful action, not just completion — a
    // handler just needs to set the attribute.
    document.body.addEventListener('htmx:afterSwap', function () {
      document.querySelectorAll('[data-dismiss-after]:not([data-dismiss-scheduled])').forEach(function (el) {
        el.setAttribute('data-dismiss-scheduled', '1');
        var delay = parseInt(el.getAttribute('data-dismiss-after'), 10) || 0;
        window.setTimeout(function () {
          el.classList.add('dismiss-fade-out');
          window.setTimeout(function () { el.remove(); }, 300);
        }, delay);
      });
    });

    // Mirrors #sidebar-mobile's backdrop-click-to-close: clicking anywhere outside the
    // expanded desktop sidebar (and outside its own toggle button, so that click doesn't
    // immediately re-open what toggleSidebar() just closed) collapses it too.
    document.addEventListener("click", function (evt) {
      if (window.innerWidth < 1024) return;
      if (document.documentElement.classList.contains("sidebar-collapsed")) return;
      var sidebar = document.getElementById("sidebar-desktop");
      var toggleBtn = document.getElementById("sidebar-toggle-btn");
      if (!sidebar || sidebar.contains(evt.target)) return;
      if (toggleBtn && toggleBtn.contains(evt.target)) return;
      toggleSidebar();
    });
  </script>
  <!-- Persistent action dialog — row action buttons (e.g. the reschedule calendar icon)
       hx-get into this via hx-swap="innerHTML" so the element's own id (and the open/close
       wiring below) survives across opens; only its content changes per action. -->
  <dialog id="action-dialog"
    class="group/dialog fixed inset-0 size-auto max-h-none max-w-none overflow-y-auto bg-transparent backdrop:bg-transparent">
  </dialog>
</body>

</html>
