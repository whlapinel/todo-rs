<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Todo{% endblock %}</title>
  <link rel="stylesheet" href="/web/static/style.css" />
  <script>
    // Fallback for the tzOffsetMinutes header (see the htmx:configRequest listener below):
    // that header only exists on htmx-issued requests, so a raw full-page load (bookmark,
    // hard refresh, typed URL) never carries one. This cookie, sent automatically on every
    // request including that first one, is what the server falls back to for those — see
    // TzOffset::from_request_parts in src/handlers/web_ui/mod.rs. Only a page's very first
    // load, before this has ever run once, is truly unavoidable (no cookie yet either).
    document.cookie = "tz_offset=" + new Date().getTimezoneOffset() + "; path=/; max-age=31536000; samesite=lax";
  </script>
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-gray-900 dark:text-white" hx-boost="true" hx-target="#page" hx-select="#page" hx-swap="innerHTML">
  {% block header %}
  <header class="border-b border-gray-200 bg-white dark:border-white/10 dark:bg-gray-900">
    <div class="max-w-3xl mx-auto flex items-center justify-between px-6 py-3">
      <a href="/web/items" class="text-sm font-semibold text-gray-900 dark:text-white">Todo</a>
      <nav class="flex items-center gap-x-4 text-sm text-gray-600 dark:text-gray-400">
        <a href="/web/items" class="hover:text-gray-900 dark:hover:text-white">Items</a>
        <a href="/web/dashboard" class="hover:text-gray-900 dark:hover:text-white">Dashboard</a>
        <a href="/web/teams" class="hover:text-gray-900 dark:hover:text-white">Teams</a>
        <a href="/web/assigned-items" class="hover:text-gray-900 dark:hover:text-white">Assigned to me</a>
        <a href="/web/checklists" class="hover:text-gray-900 dark:hover:text-white">Checklists</a>
        <a href="/auth/logout" class="hover:text-gray-900 dark:hover:text-white">Log out</a>
      </nav>
    </div>
  </header>
  {% endblock %}

  <main id="page" class="max-w-3xl mx-auto px-6 py-8">
    {% block content %}{% endblock %}
  </main>

  <script src="/web/static/js/htmx.min.js"></script>
  <script>
    document.body.addEventListener("htmx:configRequest", function (evt) {
      evt.detail.headers["X-Tz-Offset-Minutes"] = new Date().getTimezoneOffset();
    });
  </script>
</body>
</html>
