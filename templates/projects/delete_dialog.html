{% import "macros.html" as macros %}
<!-- Swapped into #action-dialog's innerHTML (see base.html), same shell as
     components/reschedule_dialog.html. Double-confirmation for this one destructive action
     (per the "No way exists to delete projects... need double-confirmation" backlog ask,
     stronger than every other delete's single hx-confirm in this app): the submit button
     stays disabled until the typed name exactly matches, AND the submit itself still carries
     its own hx-confirm as a second, independent barrier. -->
<div id="dialog-backdrop"
    class="fixed inset-0 bg-gray-500/75 dark:bg-gray-900/50 transition-opacity duration-300 ease-out opacity-0 group-open/dialog:opacity-100">
</div>

<div tabindex="0"
    class="relative z-10 flex min-h-full items-end justify-center p-4 text-center focus:outline-none sm:items-center sm:p-0">
    <div class="relative transform overflow-hidden rounded-lg bg-white dark:bg-gray-800 px-4 pt-5 pb-4 text-left shadow-xl transition-all duration-300 ease-out translate-y-4 opacity-0 scale-95 group-open/dialog:translate-y-0 group-open/dialog:opacity-100 group-open/dialog:scale-100 sm:my-8 sm:w-full sm:max-w-lg sm:p-6 dark:outline dark:-outline-offset-1 dark:outline-white/10">
        <form hx-delete="/web/projects/{{ project_id }}"
            hx-confirm="This permanently deletes &quot;{{ name }}&quot; and every task, event, and series in it. This cannot be undone. Continue?"
            hx-target="this">
            <h3 class="text-base font-semibold text-gray-900 dark:text-white">Delete project</h3>
            <div class="mt-3 text-left">
                <p class="text-sm text-gray-500 dark:text-gray-400">This permanently deletes <strong>{{ name }}</strong> and everything in it — every task, event, series, and its activity history. This cannot be undone.</p>
                <label class="mt-4 block text-sm/6 font-medium text-gray-900 dark:text-white">Type <strong>{{ name }}</strong> to confirm
                    <input type="text" autocomplete="off" data-expected="{{ name }}"
                        oninput="this.form.querySelector('[type=submit]').disabled = this.value !== this.dataset.expected"
                        class="mt-2 block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 focus:outline-2 focus:-outline-offset-2 focus:outline-red-600 sm:text-sm/6 dark:bg-white/5 dark:text-white dark:outline-white/10 dark:focus:outline-red-500" />
                </label>
            </div>
            <div class="mt-5 sm:mt-6 sm:grid sm:grid-flow-row-dense sm:grid-cols-2 sm:gap-3">
                <button type="submit" disabled
                    class="inline-flex w-full justify-center rounded-md bg-red-600 px-3 py-2 text-sm font-semibold text-white shadow-xs hover:bg-red-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-red-600 disabled:opacity-50 disabled:hover:bg-red-600 sm:col-start-2 dark:bg-red-500 dark:shadow-none dark:hover:bg-red-400 dark:disabled:hover:bg-red-500">Delete forever</button>
                <button type="button" onclick="document.getElementById('action-dialog').close()"
                    class="mt-3 inline-flex w-full justify-center rounded-md bg-white px-3 py-2 text-sm font-semibold text-gray-900 shadow-xs inset-ring-1 inset-ring-gray-300 hover:bg-gray-50 sm:col-start-1 sm:mt-0 dark:bg-white/10 dark:text-white dark:shadow-none dark:inset-ring-white/5 dark:hover:bg-white/20">Cancel</button>
            </div>
        </form>
    </div>
</div>
