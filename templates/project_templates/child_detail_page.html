{% extends "base.html" %}
{% block title %}{{ name }} · Todo{% endblock %}
{% block content %}
{{ dialog|safe }}
<!-- Direct-URL/bookmark access only (Decision 3 of docs/dialog-item-forms-plan.md) — see
     docs/item-detail-full-page-retirement.md: this page used to also render a full duplicate
     of the dialog's content (header with Edit/Back links) underneath the auto-opened dialog;
     that's retired now, matching edit_page.html/new_page.html's own dialog-only shape. An
     htmx-triggered open already selected just #dialog-fragment out of this response, so this
     sibling <script> is never part of what gets swapped in that path; it only runs on an
     actual full-page load. Moves (not copies) #dialog-fragment's children into base.html's
     persistent #action-dialog so nothing inert is left behind in #page once the dialog is
     showing. -->
<script>
  (function () {
    var dialog = document.getElementById('action-dialog');
    var frag = document.getElementById('dialog-fragment');
    if (dialog && frag && !dialog.open) {
      dialog.innerHTML = '';
      while (frag.firstChild) dialog.appendChild(frag.firstChild);
      frag.remove();
      htmx.process(dialog);
      dialog.showModal();
    }
  })();
</script>
{% endblock %}
