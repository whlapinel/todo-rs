{% import "macros.html" as macros %}
<div id="dialog-fragment">
  <div id="dialog-backdrop"
    class="fixed inset-0 bg-gray-500/75 dark:bg-gray-900/50 transition-opacity duration-300 ease-out opacity-0 group-open/dialog:opacity-100">
  </div>
  <div tabindex="0"
    class="relative z-10 flex min-h-full items-end justify-center p-4 text-center focus:outline-none sm:items-center sm:p-0">
    <div class="relative transform overflow-hidden rounded-lg bg-white dark:bg-gray-800 px-4 pt-5 pb-4 text-left shadow-xl transition-all duration-300 ease-out translate-y-4 opacity-0 scale-95 group-open/dialog:translate-y-0 group-open/dialog:opacity-100 group-open/dialog:scale-100 sm:my-8 sm:w-full sm:max-w-lg sm:p-6 dark:outline dark:-outline-offset-1 dark:outline-white/10">
      <div id="template-item-{{ id }}-fields" class="space-y-3">
        <form hx-put="/web/projects/{{ project_id }}/templates/{{ template_id }}/items/{{ id }}"
          hx-target="#template-item-{{ id }}" hx-select="#template-item-{{ id }}" hx-swap="outerHTML"
          hx-on::after-request="if(event.detail.successful) document.getElementById('action-dialog').close()"
          class="space-y-3">
          <h3 class="text-base font-semibold text-gray-900 dark:text-white">Edit item</h3>
          <label class="block text-sm/6 font-medium text-gray-900 dark:text-white">Name <span
              class="text-red-500" aria-hidden="true">*</span>
            <div class="mt-2">
              <input type="text" name="name" value="{{ name }}" required maxlength="200"
                class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-600 sm:text-sm/6 dark:bg-white/5 dark:text-white dark:outline-white/10 dark:placeholder:text-gray-500 dark:focus:outline-indigo-500" />
            </div>
          </label>
          <label class="block text-sm/6 font-medium text-gray-900 dark:text-white">Days before due date
            <div class="mt-2">
              <input type="number" name="dueOffsetDays" value="{{ due_offset_days_input }}" min="0" step="1"
                class="block w-20 rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-600 sm:text-sm/6 dark:bg-white/5 dark:text-white dark:outline-white/10 dark:focus:outline-indigo-500" />
            </div>
          </label>
          <div class="mt-5 sm:mt-6 sm:grid sm:grid-flow-row-dense sm:grid-cols-2 sm:gap-3">
            <button type="submit"
              class="inline-flex w-full justify-center rounded-md bg-indigo-600 px-3 py-2 text-sm font-semibold text-white shadow-xs hover:bg-indigo-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600 sm:col-start-2 dark:bg-indigo-500 dark:shadow-none dark:hover:bg-indigo-400 dark:focus-visible:outline-indigo-500">Save</button>
            <button type="button" onclick="document.getElementById('action-dialog').close()"
              class="mt-3 inline-flex w-full justify-center rounded-md bg-white px-3 py-2 text-sm font-semibold text-gray-900 shadow-xs inset-ring-1 inset-ring-gray-300 hover:bg-gray-50 sm:col-start-1 sm:mt-0 dark:bg-white/10 dark:text-white dark:shadow-none dark:inset-ring-white/5 dark:hover:bg-white/20">Cancel</button>
          </div>
          {% if just_saved %}
          <span class="toast-fade text-sm text-green-600">&#10003; Saved</span>
          {% endif %}
        </form>
      </div>
    </div>
  </div>
</div>
