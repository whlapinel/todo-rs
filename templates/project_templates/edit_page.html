{% extends "base.html" %}
{% import "macros.html" as macros %}
{% block title %}Edit {{ name }} · Template{% endblock %}
{% block content %}
<div class="space-y-6">
  <div class="min-w-0 flex-1">
    <h2 class="text-2xl/7 font-bold text-gray-900 sm:truncate sm:text-3xl sm:tracking-tight dark:text-white">Edit {{ name }}</h2>
  </div>

  <form hx-put="/web/projects/{{ project_id }}/templates/{{ id }}" hx-target="#page" hx-select="#page" hx-swap="innerHTML" hx-push-url="/web/projects/{{ project_id }}/templates/{{ id }}"
        class="max-w-xl space-y-4 rounded-lg border border-gray-200 bg-white p-4 dark:border-white/10 dark:bg-gray-800/50">
    <label class="block text-sm/6 font-medium text-gray-900 dark:text-white">Name <span class="text-red-500" aria-hidden="true">*</span>
      <div class="mt-2">
        <input type="text" name="name" value="{{ name }}" required maxlength="200"
               class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-600 sm:text-sm/6 dark:bg-white/5 dark:text-white dark:outline-white/10 dark:placeholder:text-gray-500 dark:focus:outline-indigo-500" />
      </div>
    </label>
    {% call macros::description_field(description) %}{% endcall %}
    <label class="block text-sm/6 font-medium text-gray-900 dark:text-white">Auto-triggered by event type
      <div class="mt-2">
        <input type="text" name="eventType" value="{{ event_type }}" placeholder="e.g. rain (optional)"
               class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-600 sm:text-sm/6 dark:bg-white/5 dark:text-white dark:outline-white/10 dark:placeholder:text-gray-500 dark:focus:outline-indigo-500" />
      </div>
      <p class="mt-1 text-xs text-gray-500 dark:text-gray-400">When set, creating a new Event with this same event type automatically copies this template's sub-items onto it.</p>
    </label>
    <div class="flex items-center gap-x-3">
      <button type="submit" class="inline-flex items-center justify-center rounded-md bg-indigo-600 px-3 py-2 text-sm font-semibold text-white shadow-xs hover:bg-indigo-500 dark:bg-indigo-500 dark:shadow-none dark:hover:bg-indigo-400">Save and close</button>
      <a href="/web/projects/{{ project_id }}/templates/{{ id }}" hx-target="#page" hx-select="#page" hx-swap="innerHTML"
         class="inline-flex items-center justify-center rounded-md bg-white px-3 py-2 text-sm font-semibold text-gray-900 shadow-xs inset-ring inset-ring-gray-300 hover:bg-gray-50 dark:bg-white/10 dark:text-white dark:shadow-none dark:inset-ring-white/5 dark:hover:bg-white/20">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
