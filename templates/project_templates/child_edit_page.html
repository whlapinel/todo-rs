{% extends "base.html" %}
{% block title %}Edit {{ name }} · Todo{% endblock %}
{% block content %}
{{ fields|safe }}
<script>
  (function () {
    function open() {
      var dialog = document.getElementById('action-dialog');
      var frag = document.getElementById('dialog-fragment');
      if (dialog && frag && !dialog.open) {
        dialog.innerHTML = '';
        while (frag.firstChild) dialog.appendChild(frag.firstChild);
        frag.remove();
        htmx.process(dialog);
        dialog.showModal();
        focusDialogContent(dialog);
      }
    }
    if (document.getElementById('action-dialog')) {
      open();
    } else {
      // See project_tasks/edit_page.html's identical script for why this fallback
      // (and the focusDialogContent call above) exist.
      document.addEventListener('DOMContentLoaded', open);
    }
  })();
</script>
{% endblock %}
