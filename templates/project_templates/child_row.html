<li id="template-item-{{ id }}" class="py-2">
  <button type="button" hx-get="/web/projects/{{ project_id }}/templates/{{ template_id }}/items/{{ id }}"
    hx-target="#action-dialog" hx-select="#dialog-fragment" hx-swap="innerHTML"
    class="block w-full truncate text-left cursor-pointer text-gray-900 hover:text-indigo-600 dark:text-white dark:hover:text-indigo-400">{{ name }}</button>
  <div class="mt-1 flex items-center justify-between gap-x-3 text-xs text-gray-500 dark:text-gray-400">
    <span>{{ offset_label }}</span>
    <button hx-delete="/web/projects/{{ project_id }}/templates/{{ template_id }}/items/{{ id }}"
            hx-confirm="Remove {{ name }}?" hx-target="#template-item-{{ id }}" hx-select="unset"
            hx-swap="outerHTML swap:200ms" class="shrink-0 cursor-pointer text-red-600 hover:text-red-500 dark:text-red-400 dark:hover:text-red-300">Remove</button>
  </div>
</li>
