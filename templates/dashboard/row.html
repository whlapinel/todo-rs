<li id="dash-item-{{ item_id }}" class="py-2">
  <div class="flex items-center gap-x-3">
    <input type="checkbox" {% if complete %}checked{% endif %}
           hx-put="{{ toggle_target }}" hx-vals='{"complete": "{{ toggle_complete_json }}"}'
           hx-target="#dash-item-{{ item_id }}" hx-select="unset" hx-swap="outerHTML"
           class="shrink-0 size-4 rounded border-gray-300 text-indigo-600 focus:ring-indigo-600 dark:border-white/20 dark:bg-white/5" />
    <a href="{{ detail_link }}"
       class="min-w-0 flex-1 truncate {% if complete %}line-through text-gray-400 dark:text-gray-500{% else %}text-gray-900 dark:text-white{% endif %}">{{ name }}</a>
  </div>
  <div class="mt-1 flex items-center gap-x-3 pl-7 text-xs text-gray-500 dark:text-gray-400">
    <div class="flex min-w-0 flex-1 flex-wrap items-center gap-x-3 gap-y-1">
      {% if let Some(p) = parent_name %}<span class="text-indigo-600 dark:text-indigo-400">[{{ p }}]</span>{% endif %}
      {% if let Some(badge) = from_badge %}<span class="text-indigo-600 dark:text-indigo-400">[{{ badge }}]</span>{% endif %}
      {% if let Some(d) = due_date %}<span>{{ d }}</span>{% endif %}
    </div>
    {% if can_delete %}
    <button hx-delete="{{ detail_link }}"
            hx-confirm="Delete {{ name }}?"
            hx-target="#dash-item-{{ item_id }}" hx-select="unset" hx-swap="outerHTML swap:200ms"
            class="shrink-0 cursor-pointer text-red-600 hover:text-red-500 dark:text-red-400 dark:hover:text-red-300">Delete</button>
    {% endif %}
  </div>
</li>
