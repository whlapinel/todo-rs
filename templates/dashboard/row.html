<li id="dash-item-{{ item_id }}" class="flex items-center justify-between gap-x-3 py-2">
  <div class="flex items-center gap-x-3 min-w-0">
    <input type="checkbox" {% if complete %}checked{% endif %}
           hx-put="{{ toggle_target }}" hx-vals='{"complete": "{{ toggle_complete_json }}"}'
           hx-target="#dash-item-{{ item_id }}" hx-select="unset" hx-swap="outerHTML"
           class="shrink-0 size-4 rounded border-gray-300 text-indigo-600 focus:ring-indigo-600 dark:border-white/20 dark:bg-white/5" />
    <a href="{{ detail_link }}"
       class="truncate {% if complete %}line-through text-gray-400 dark:text-gray-500{% else %}text-gray-900 dark:text-white{% endif %}">{{ name }}</a>
    {% if let Some(p) = parent_name %}<span class="text-xs text-indigo-600 shrink-0 dark:text-indigo-400">[{{ p }}]</span>{% endif %}
    {% if let Some(badge) = from_badge %}<span class="text-xs text-indigo-600 shrink-0 dark:text-indigo-400">[{{ badge }}]</span>{% endif %}
  </div>
  <div class="flex items-center gap-x-3 text-xs text-gray-500 shrink-0 dark:text-gray-400">
    {% if let Some(d) = due_date %}<span>{{ d }}</span>{% endif %}
    {% if can_delete %}
    <button hx-delete="{{ detail_link }}"
            hx-confirm="Delete {{ name }}?"
            hx-target="#dash-item-{{ item_id }}" hx-select="unset" hx-swap="outerHTML swap:200ms"
            class="cursor-pointer text-red-600 hover:text-red-500 dark:text-red-400 dark:hover:text-red-300">Delete</button>
    {% endif %}
  </div>
</li>
