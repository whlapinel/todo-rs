{% extends "base.html" %}
{% block title %}Dashboard · Todo{% endblock %}
{% block content %}
<div class="space-y-6">
  <div class="flex items-center justify-between flex-wrap gap-y-2">
    <h1 class="text-2xl font-semibold text-slate-900">Dashboard</h1>
    <div class="flex items-center gap-x-4">
      <label class="text-sm text-slate-700">View
        <select name="preset" class="ml-1 rounded-md border-slate-300 text-sm"
                hx-get="/web/dashboard" hx-trigger="change" hx-target="#page" hx-select="#page"
                hx-swap="innerHTML" hx-push-url="true" hx-include="[name='showComplete']">
          {% for entry in presets %}
          <option value="{{ entry.0 }}" {% if entry.1 %}selected{% endif %}>{{ entry.0 }}</option>
          {% endfor %}
        </select>
      </label>
      <label class="text-sm text-slate-600 flex items-center gap-x-1">
        <input type="checkbox" name="showComplete" value="1" {% if show_complete %}checked{% endif %}
               hx-get="/web/dashboard" hx-trigger="change" hx-target="#page" hx-select="#page"
               hx-swap="innerHTML" hx-push-url="true" hx-include="[name='preset']" />
        Show completed
      </label>
    </div>
  </div>

  <ul id="dashboard-list" class="divide-y divide-slate-100 rounded-lg border border-slate-200 bg-white px-4">
    {% if rows.is_empty() %}
    <li class="py-3 text-sm text-slate-500">No items.</li>
    {% else %}
    {% for row in rows %}
    {{ row|safe }}
    {% endfor %}
    {% endif %}
  </ul>
</div>
{% endblock %}
