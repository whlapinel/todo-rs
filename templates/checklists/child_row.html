<li id="checklist-item-{{ id }}" class="flex items-center justify-between gap-x-3 py-2">
  <a href="/web/checklists/{{ template_id }}/items/{{ id }}" hx-target="#page" hx-select="#page" hx-swap="innerHTML"
     class="truncate text-slate-900">{{ name }}</a>
  <div class="flex items-center gap-x-3 text-xs text-slate-500 shrink-0">
    <span>{{ offset_label }}</span>
    <button hx-delete="/web/checklists/{{ template_id }}/items/{{ id }}"
            hx-confirm="Remove {{ name }}?" hx-target="#checklist-item-{{ id }}" hx-select="unset"
            hx-swap="outerHTML swap:200ms" class="cursor-pointer text-red-500 hover:text-red-700">Remove</button>
  </div>
</li>
