{% extends "base.html" %}
{% block title %}Checklists · Todo{% endblock %}
{% block content %}
<div class="space-y-6">
  <h1 class="text-2xl font-semibold text-slate-900">Checklists</h1>

  <form hx-post="/web/checklists" hx-target="#checklists-list" hx-select="unset" hx-swap="innerHTML"
        hx-on::after-request="if(event.detail.successful) this.reset()"
        class="rounded-lg border border-slate-200 bg-white p-4 flex items-center gap-x-2">
    <input type="text" name="name" placeholder="New checklist" required class="flex-1 rounded-md border-slate-300 text-sm" />
    <button type="submit" class="cursor-pointer rounded-md bg-slate-900 text-white text-sm px-3 py-1.5">Add checklist</button>
  </form>

  <ul id="checklists-list" class="divide-y divide-slate-100 rounded-lg border border-slate-200 bg-white px-4">
    {% if rows.is_empty() %}
    <li class="py-3 text-sm text-slate-500">No checklists yet. Create one here or save one from an item.</li>
    {% else %}
    {% for row in rows %}
    {{ row|safe }}
    {% endfor %}
    {% endif %}
  </ul>
</div>
{% endblock %}
