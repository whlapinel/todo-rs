<li id="checklist-{{ id }}" class="py-3 space-y-2">
  <div class="flex items-center justify-between gap-x-3">
    <a href="/web/checklists/{{ id }}" hx-target="#page" hx-select="#page" hx-swap="innerHTML"
       class="text-slate-900 hover:underline">{{ name }}</a>
    <div class="flex items-center gap-x-3 text-xs">
      {% if let Some(r) = recurrence %}<span class="text-slate-400" title="repeats">&#8635; {{ r }}</span>{% endif %}
      <button hx-delete="/web/checklists/{{ id }}" hx-confirm="Delete checklist {{ name }}?"
              hx-target="#checklist-{{ id }}" hx-select="unset" hx-swap="outerHTML swap:200ms"
              class="cursor-pointer text-red-500 hover:text-red-700">Delete</button>
    </div>
  </div>
  <details>
    <summary class="cursor-pointer text-xs text-slate-500">Use&hellip;</summary>
    <form hx-post="/web/checklists/{{ id }}/use" hx-target="#page" hx-select="#page" hx-swap="innerHTML"
          class="mt-2 flex items-center gap-x-2">
      <input type="text" name="name" value="{{ name }}" required class="flex-1 rounded-md border-slate-300 text-sm" />
      <input type="date" name="dueDate" class="rounded-md border-slate-300 text-sm" />
      <button type="submit" class="cursor-pointer rounded-md bg-slate-900 text-white text-sm px-3 py-1.5">Add to items</button>
    </form>
  </details>
</li>
