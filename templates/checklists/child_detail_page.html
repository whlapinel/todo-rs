{% extends "base.html" %}
{% block title %}{{ name }} · Todo{% endblock %}
{% block content %}
<div class="space-y-6">
  <div class="flex items-center justify-between">
    <h1 class="text-2xl font-semibold text-slate-900">{{ name }}</h1>
    <div class="flex items-center gap-x-4">
      <a href="/web/checklists/{{ template_id }}/items/{{ id }}/edit" class="text-sm text-slate-600 hover:underline">Edit</a>
      <a href="/web/checklists/{{ template_id }}" class="text-sm text-slate-600 hover:underline">Back to checklist</a>
    </div>
  </div>

  {{ view|safe }}
</div>
{% endblock %}
