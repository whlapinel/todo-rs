{% extends "base.html" %}
{% block title %}{{ name }} · Checklist{% endblock %}
{% block content %}
<div class="space-y-6">
  <div class="flex items-center justify-between">
    <h1 class="text-2xl font-semibold text-slate-900">{{ name }}</h1>
    <a href="/web/checklists" class="text-sm text-slate-600 hover:underline">Back to checklists</a>
  </div>

  <ul id="checklist-items" class="divide-y divide-slate-100 rounded-lg border border-slate-200 bg-white px-4"
      hx-get="/web/checklists/{{ id }}/items" hx-trigger="load"
      hx-target="this" hx-select="unset" hx-swap="innerHTML"></ul>

  <form hx-post="/web/checklists/{{ id }}" hx-target="#checklist-items" hx-select="unset" hx-swap="innerHTML"
        hx-on::after-request="if(event.detail.successful) this.reset()"
        class="flex items-end gap-x-2">
    <label class="flex-1 block text-sm text-slate-700">New item
      <input type="text" name="name" placeholder="Name" required class="mt-1 block w-full rounded-md border-slate-300 text-sm" />
    </label>
    <label class="block text-sm text-slate-700">Offset days
      <input type="number" name="dueOffsetDays" class="mt-1 block w-20 rounded-md border-slate-300 text-sm" />
    </label>
    <button type="submit" class="cursor-pointer rounded-md bg-slate-900 text-white text-sm px-3 py-1.5">Add</button>
  </form>
</div>
{% endblock %}
