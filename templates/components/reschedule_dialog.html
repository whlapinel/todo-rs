<dialog id="dialog" aria-labelledby="dialog-title"
    class="fixed inset-0 size-auto max-h-none max-w-none overflow-y-auto bg-transparent backdrop:bg-transparent group/dialog">

    <!-- Custom Backdrop using native CSS transition targeting -->
    <div id="dialog-backdrop"
        class="fixed inset-0 bg-gray-500/75 dark:bg-gray-900/50 transition-opacity duration-300 ease-out opacity-0 group-open/dialog:opacity-100">
    </div>

    <!-- Centering Layout Layer -->
    <div tabindex="0"
        class="relative z-10 flex min-h-full items-end justify-center p-4 text-center focus:outline-none sm:items-center sm:p-0">

        <!-- Dialog Panel with pure Tailwind v4 entry transition triggers -->
        <div id="dialog-panel"
            class="relative transform overflow-hidden rounded-lg bg-white dark:bg-gray-800 px-4 pt-5 pb-4 text-left shadow-xl transition-all duration-300 ease-out translate-y-4 opacity-0 scale-95 group-open/dialog:translate-y-0 group-open/dialog:opacity-100 group-open/dialog:scale-100 sm:my-8 sm:w-full sm:max-w-lg sm:p-6 dark:outline dark:-outline-offset-1 dark:outline-white/10">

            <!-- Form Body Context -->
            <div>
                <div class="mt-3 text-left sm:mt-5">
                    <div>
                        <!-- Due Date Input -->
                        <div class="m-3 flex gap-3">
                            <div>
                                <label for="due-date"
                                    class="block text-sm/6 font-medium text-gray-900 dark:text-white">Due
                                    Date</label>
                                <div class="mt-2">
                                    <input id="due-date" type="date" name="due-date" placeholder="2026-09-10"
                                        class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-600 sm:text-sm/6 dark:bg-white/5 dark:text-white dark:outline-white/10 dark:placeholder:text-gray-500 dark:focus:outline-indigo-500" />
                                </div>
                            </div>
                            <div>
                                <label for="due-time" class="block text-sm/6 font-medium text-gray-900 dark:text-white">
                                    Time</label>
                                <div class="mt-2">
                                    <input id="due-time" type="time" name="due-time"
                                        class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-600 sm:text-sm/6 dark:bg-white/5 dark:text-white dark:outline-white/10 dark:placeholder:text-gray-500 dark:focus:outline-indigo-500" />
                                </div>
                            </div>
                        </div>

                        <!-- Scheduled Start Date Input -->
                        <div class="m-3 flex gap-3">
                            <div>
                                <label for="scheduled-start-date"
                                    class="block text-sm/6 font-medium text-gray-900 dark:text-white">Scheduled
                                    Start
                                    Date</label>
                                <div class="mt-2">
                                    <input id="scheduled-start-date" type="date" name="scheduled-start-date"
                                        placeholder="2026-09-10"
                                        class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-600 sm:text-sm/6 dark:bg-white/5 dark:text-white dark:outline-white/10 dark:placeholder:text-gray-500 dark:focus:outline-indigo-500" />
                                </div>
                            </div>
                            <div>
                                <label for="scheduled-start-time"
                                    class="block text-sm/6 font-medium text-gray-900 dark:text-white">
                                    Time</label>
                                <div class="mt-2">
                                    <input id="scheduled-start-time" type="time" name="scheduled-start-time"
                                        placeholder="2026-09-10"
                                        class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-600 sm:text-sm/6 dark:bg-white/5 dark:text-white dark:outline-white/10 dark:placeholder:text-gray-500 dark:focus:outline-indigo-500" />
                                </div>
                            </div>
                        </div>

                        <!-- Scheduled End Date Input -->
                        <div class="m-3 flex gap-3">
                            <div>
                                <label for="scheduled-end-date"
                                    class="block text-sm/6 font-medium text-gray-900 dark:text-white">Scheduled End
                                    Date</label>
                                <div class="mt-2">
                                    <input id="scheduled-end-date" type="date" name="scheduled-end-date"
                                        placeholder="2026-09-10"
                                        class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-600 sm:text-sm/6 dark:bg-white/5 dark:text-white dark:outline-white/10 dark:placeholder:text-gray-500 dark:focus:outline-indigo-500" />
                                </div>
                            </div>
                            <div>
                                <label for="scheduled-end-time"
                                    class="block text-sm/6 font-medium text-gray-900 dark:text-white">Time</label>
                                <div class="mt-2">
                                    <input id="scheduled-end-time" type="time" name="scheduled-end-time"
                                        placeholder="2026-09-10"
                                        class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-600 sm:text-sm/6 dark:bg-white/5 dark:text-white dark:outline-white/10 dark:placeholder:text-gray-500 dark:focus:outline-indigo-500" />
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Action Buttons utilizing native browser dialog commands -->
            <div class="mt-5 sm:mt-6 sm:grid sm:grid-flow-row-dense sm:grid-cols-2 sm:gap-3">
                <button type="button" command="close" commandfor="dialog"
                    class="inline-flex w-full justify-center rounded-md bg-indigo-600 px-3 py-2 text-sm font-semibold text-white shadow-xs hover:bg-indigo-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600 sm:col-start-2 dark:bg-indigo-500 dark:shadow-none dark:hover:bg-indigo-400 dark:focus-visible:outline-indigo-500">Save</button>
                <button type="button" command="close" commandfor="dialog"
                    class="mt-3 inline-flex w-full justify-center rounded-md bg-white px-3 py-2 text-sm font-semibold text-gray-900 shadow-xs inset-ring-1 inset-ring-gray-300 hover:bg-gray-50 sm:col-start-1 sm:mt-0 dark:bg-white/10 dark:text-white dark:shadow-none dark:inset-ring-white/5 dark:hover:bg-white/20">Cancel</button>
            </div>
        </div>
    </div>
</dialog>
