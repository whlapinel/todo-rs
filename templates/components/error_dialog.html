<!-- Swapped into #error-dialog's innerHTML (see base.html) — same fragment shape as
     reschedule_dialog.html/quick_assign_dialog.html, no <dialog> wrapper of its own.
     Adapted from ../tailwind-ui-html/html/overlays/modal-dialogs/03-simple-alert.html,
     the stock "simple alert" modal — swapped its Tailwind Plus Elements
     `el-dialog`/`data-closed:`/`data-enter:` primitives for this repo's own
     group/dialog convention (see base.html's persistent <dialog> shell) to match
     reschedule_dialog.html/quick_assign_dialog.html exactly. -->
<div id="dialog-backdrop"
    class="fixed inset-0 bg-gray-500/75 dark:bg-gray-900/50 transition-opacity duration-300 ease-out opacity-0 group-open/dialog:opacity-100">
</div>

<div tabindex="0"
    class="relative z-10 flex min-h-full items-end justify-center p-4 text-center focus:outline-none sm:items-center sm:p-0">
    <div class="relative transform overflow-hidden rounded-lg bg-white dark:bg-gray-800 px-4 pt-5 pb-4 text-left shadow-xl transition-all duration-300 ease-out translate-y-4 opacity-0 scale-95 group-open/dialog:translate-y-0 group-open/dialog:opacity-100 group-open/dialog:scale-100 sm:my-8 sm:w-full sm:max-w-lg sm:p-6 dark:outline dark:-outline-offset-1 dark:outline-white/10">
        <div class="sm:flex sm:items-start">
            <div class="mx-auto flex size-12 shrink-0 items-center justify-center rounded-full bg-red-100 dark:bg-red-500/10 sm:mx-0 sm:size-10">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"
                    class="size-6 text-red-600 dark:text-red-400">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z" />
                </svg>
            </div>
            <div class="mt-3 text-center sm:mt-0 sm:ml-4 sm:text-left">
                <h3 id="error-dialog-title" class="text-base font-semibold text-gray-900 dark:text-white">Error</h3>
                <div class="mt-2">
                    <p class="text-sm text-gray-500 dark:text-gray-400">{{ message }}</p>
                </div>
            </div>
        </div>
        <div class="mt-5 sm:mt-4 sm:flex sm:flex-row-reverse">
            <button type="button" onclick="document.getElementById('error-dialog').close()"
                class="inline-flex w-full justify-center rounded-md bg-red-600 px-3 py-2 text-sm font-semibold text-white shadow-xs hover:bg-red-500 sm:ml-3 sm:w-auto dark:bg-red-500 dark:shadow-none dark:hover:bg-red-400">OK</button>
        </div>
    </div>
</div>
