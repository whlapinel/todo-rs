<div class="flex items-center justify-between gap-x-4 py-3 border-b border-slate-200">
  <a href="/web/items/{{ id }}" class="text-sm font-medium text-slate-900 hover:underline">
    {{ name }}
  </a>
  <div class="flex items-center gap-x-3 text-xs text-slate-500">
    {% if let Some(d) = due_date %}
    <span>Due: {{ d }}</span>
    {% endif %}
    {% if complete %}
    <span class="font-medium text-green-600">done</span>
    {% else %}
    <span class="font-medium text-amber-600">not done</span>
    {% endif %}
  </div>
</div>
