<li id="template-{{ id }}" class="py-3 space-y-2">
  <div class="flex items-center justify-between gap-x-3">
    <a href="/web/templates/{{ id }}" hx-target="#page" hx-select="#page" hx-swap="innerHTML"
       class="min-w-0 flex-1 truncate text-gray-900 hover:text-indigo-600 dark:text-white dark:hover:text-indigo-400">{{ name }}</a>
    <div class="flex shrink-0 items-center gap-x-3 text-xs">
      {% if let Some(r) = recurrence %}<span class="text-gray-400 dark:text-gray-500" title="repeats">&#8635; {{ r }}</span>{% endif %}
      <button hx-delete="/web/templates/{{ id }}" hx-confirm="Delete template {{ name }}?"
              hx-target="#template-{{ id }}" hx-select="unset" hx-swap="outerHTML swap:200ms"
              class="cursor-pointer text-red-600 hover:text-red-500 dark:text-red-400 dark:hover:text-red-300">Delete</button>
    </div>
  </div>
  <details>
    <summary class="cursor-pointer text-xs text-gray-500 dark:text-gray-400">Use&hellip;</summary>
    <form hx-post="/web/templates/{{ id }}/use" hx-target="#page" hx-select="#page" hx-swap="innerHTML"
          class="mt-2 flex items-center gap-x-2">
      <input type="text" name="name" value="{{ name }}" required maxlength="200"
             class="flex-1 rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-600 sm:text-sm/6 dark:bg-white/5 dark:text-white dark:outline-white/10 dark:placeholder:text-gray-500 dark:focus:outline-indigo-500" />
      <input type="date" name="dueDate"
             class="rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-600 sm:text-sm/6 dark:bg-white/5 dark:text-white dark:outline-white/10 dark:focus:outline-indigo-500" />
      <button type="submit" class="inline-flex items-center justify-center rounded-md bg-indigo-600 px-3 py-2 text-sm font-semibold text-white shadow-xs hover:bg-indigo-500 dark:bg-indigo-500 dark:shadow-none dark:hover:bg-indigo-400">Add to items</button>
    </form>
  </details>
</li>
