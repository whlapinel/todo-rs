{% extends "base.html" %}
{% block title %}Edit {{ name }} · Todo{% endblock %}
{% block content %}
<div class="space-y-6">
  <div class="flex items-center justify-between">
    <h1 class="text-2xl font-semibold text-slate-900">Edit {{ name }}</h1>
    <a href="/web/team-items/{{ team_id }}/{{ id }}" hx-target="#page" hx-select="#page" hx-swap="innerHTML"
       class="text-sm text-slate-600 hover:underline">Back to details</a>
  </div>

  {{ fields|safe }}
</div>
{% endblock %}
