<!-- A still-virtual sub-item, on its own lead-time date. See ProjectCalendarVirtualChildRow.
     Deliberately no Skip (sub-items have none) and no Current/Planned label (that's a property
     of the parent occurrence's cursor position, not of one piece of its preparation work). -->
<li id="proj-dash-virtual-child-{{ child_id }}-{{ occurrence_ts }}" class="py-2">
  <div class="flex items-center gap-x-3">
    <input type="checkbox" hx-post="{{ complete_url }}"
      class="shrink-0 size-4 rounded border-gray-300 text-indigo-600 focus:ring-indigo-600 dark:border-white/20 dark:bg-white/5" />
    <span
      class="shrink-0 inline-flex size-4 items-center justify-center rounded-full bg-gray-200 text-[10px] font-semibold text-gray-600 dark:bg-white/10 dark:text-gray-300"
      title="Sub-item of a recurring task (not yet created)">&#8627;</span>
    <!-- See this directory's virtual_row.html for why hx-get/target/select are explicit. -->
    <a href="{{ detail_url }}" hx-get="{{ detail_url }}" hx-target="#action-dialog"
      hx-select="#dialog-fragment" hx-swap="innerHTML"
      class="min-w-0 flex-1 truncate text-gray-900 dark:text-white">{{ name }}</a>
  </div>
  <div class="mt-1 flex items-center gap-x-3 pl-7 text-xs text-gray-500 dark:text-gray-400">
    <span class="truncate text-indigo-600 dark:text-indigo-400">for {{ series_name }}</span>
    <!-- See project_tasks/virtual_child_row.html's identical offset badge. -->
    {% if let Some(label) = offset_label %}
    <span>{{ label }}</span>
    {% endif %}
    <span class="flex-1 {% if overdue %}text-red-600 dark:text-red-400{% endif %}">Due: {{ date_label }}</span>
  </div>
</li>
