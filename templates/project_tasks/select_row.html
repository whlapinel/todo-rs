<li class="py-2">
    <label
        class="flex cursor-pointer items-center gap-x-3 rounded-md px-2 py-1 -mx-2 hover:bg-gray-50 dark:hover:bg-white/5">
        <input type="checkbox" class="shrink-0 size-4 rounded border-gray-300 text-indigo-600 focus:ring-indigo-600 dark:border-white/20 dark:bg-white/5"
            data-item-id="{{ id }}" onchange="toggleBatchSelection(this)" />
        <span
            class="min-w-0 flex-1 truncate {% if complete %}line-through text-gray-400 dark:text-gray-500{% else %}text-gray-900 dark:text-white{% endif %}">{{
            name }}</span>
        {% if let Some(d) = due_date %}
        <span
            class="shrink-0 text-xs {% if overdue %}text-red-600 dark:text-red-400{% else %}text-gray-500 dark:text-gray-400{% endif %}">💀
            {{ d }}</span>
        {% endif %}
    </label>
</li>
