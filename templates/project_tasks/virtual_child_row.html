<!-- One still-virtual sub-item of a series occurrence — see
     ProjectTaskVirtualChildRow's doc comment. `id="item-{{ row_id }}"` follows the same
     convention every other selectable row uses (components/row.html, project_tasks/
     virtual_row.html): base.html's row-selection JS never distinguishes a real item from a
     virtual one, and the `child:`-prefixed composite id is resolved server-side
     (handlers::parse_virtual_row_id) if this row is ever swept into a batch action. -->
<li id="item-{{ row_id }}" class="py-2 pl-8"{% if treegrid %} role="row" aria-level="{{ level }}" aria-selected="false"{% endif %}>
  <div class="flex items-center gap-x-3">
    <!-- Alignment spacer, matching the parent row's expand-control slot — a sub-item
         definition is flat (item_series_children has no nesting), so this row can never
         have children of its own to expand. -->
    <div class="contents"{% if treegrid %} role="gridcell"{% endif %}>
    <span class="shrink-0 size-4"></span>
    </div>
    <div class="contents"{% if treegrid %} role="gridcell"{% endif %}>
    <!-- Plain text, not a link — same treegrid rule the parent row follows (a click selects
         the row; Details lives in the row-actions menu). -->
    <span class="min-w-0 flex-1 truncate text-gray-900 dark:text-white">{{ name }}</span>
    <span class="shrink-0 text-[10px] uppercase tracking-wide font-semibold text-gray-400 dark:text-gray-500">Sub-item</span>
    </div>
    <div class="contents"{% if treegrid %} role="gridcell"{% endif %}>
    <button type="button" id="row-menu-btn-{{ row_id }}" onclick="openRowActionsMenu('{{ row_id }}', this)"
      class="shrink-0 cursor-pointer text-gray-400 hover:text-gray-600 dark:text-gray-500 dark:hover:text-gray-300">
      {% include "icons/ellipses.html" %}
    </button>
    </div>
    <!-- Deliberately short: no Skip (there is no sub-item Skip — decision 4 of the sub-items
         plan), no Duplicate/Move/Delete (all need a real item id). "Open" is the sub-item's
         answer to Edit — it POSTs to materialize and lands on the now-real item's own page,
         where the ordinary task form handles every per-occurrence edit, rather than
         duplicating that form against a definition that has no per-occurrence state yet. -->
    <template id="row-actions-menu-{{ row_id }}">
      <div class="divide-y divide-gray-100 dark:divide-white/10">
        <button type="button" hx-post="{{ complete_url }}"
          {% if in_list_view %}hx-target="#items-list" hx-select="unset" hx-swap="innerHTML"{% endif %}
          class="block w-full cursor-pointer px-4 py-3 text-left text-sm text-gray-700 hover:bg-gray-50 dark:text-gray-200 dark:hover:bg-white/5">Mark complete</button>
        <a href="{{ detail_url }}" hx-get="{{ detail_url }}" hx-target="#action-dialog"
          hx-select="#dialog-fragment" hx-swap="innerHTML"
          class="block px-4 py-3 text-sm text-gray-700 hover:bg-gray-50 dark:text-gray-200 dark:hover:bg-white/5">Details</a>
        <button type="button" hx-post="{{ detail_url }}"
          class="block w-full cursor-pointer px-4 py-3 text-left text-sm text-gray-700 hover:bg-gray-50 dark:text-gray-200 dark:hover:bg-white/5">Open</button>
      </div>
    </template>
  </div>
  <div class="mt-1 flex items-center gap-x-3 pl-7 text-xs text-gray-500 dark:text-gray-400">
    <div class="flex min-w-0 flex-1 flex-wrap items-center gap-x-3 gap-y-1">
      {% if let Some(p) = priority_label %}
      <span class="text-amber-600 dark:text-amber-400">🚩 {{ p }}</span>
      {% endif %}
      <span class="{% if overdue %}text-red-600 dark:text-red-400{% endif %}">💀 {{ date_label }}</span>
    </div>
  </div>
</li>
