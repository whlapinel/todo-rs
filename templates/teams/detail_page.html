{% extends "base.html" %}
{% block title %}{{ name }} · Todo{% endblock %}
{% block content %}
<div class="space-y-6">
  <div class="flex items-center justify-between">
    <h1 class="text-2xl font-semibold text-slate-900">{{ name }}</h1>
    <div class="flex items-center gap-x-4">
      <a href="/web/team-items/{{ id }}" hx-target="#page" hx-select="#page" hx-swap="innerHTML"
         class="text-sm text-slate-600 hover:underline">View items</a>
      <a href="/web/teams" hx-target="#page" hx-select="#page" hx-swap="innerHTML"
         class="text-sm text-slate-600 hover:underline">Back to teams</a>
    </div>
  </div>

  <div>
    <h2 class="text-sm font-semibold text-slate-700 mb-2">Members</h2>
    <ul id="members-list" class="divide-y divide-slate-100 rounded-lg border border-slate-200 bg-white px-4">
      {% for row in member_rows %}
      {{ row|safe }}
      {% endfor %}
    </ul>
  </div>

  {% if is_active_member %}
  <form hx-post="/web/teams/{{ id }}/invite" hx-target="#page" hx-select="#page" hx-swap="innerHTML"
        class="rounded-lg border border-slate-200 bg-white p-4 flex items-end gap-x-2">
    <label class="flex-1 block text-sm text-slate-700">Invite someone
      <select name="inviteeUserId" class="mt-1 block w-full rounded-md border-slate-300 text-sm">
        {% for candidate in invite_candidates %}
        <option value="{{ candidate.0 }}">{{ candidate.1 }}</option>
        {% endfor %}
      </select>
    </label>
    <button type="submit" class="cursor-pointer rounded-md bg-slate-900 text-white text-sm px-3 py-1.5">Invite</button>
  </form>

  <form hx-post="/web/teams/{{ id }}/leave" hx-confirm="Leave {{ name }}?"
        hx-target="#page" hx-select="#page" hx-swap="innerHTML">
    <button type="submit" class="cursor-pointer text-sm text-red-500 hover:text-red-700">Leave team</button>
  </form>
  {% endif %}
</div>
{% endblock %}
