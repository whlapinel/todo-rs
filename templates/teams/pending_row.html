<li id="pending-{{ id }}" class="flex items-center justify-between gap-x-3 py-2">
  <div class="min-w-0">
    <span class="text-gray-900 dark:text-white">{{ name }}</span>
    {% if let Some(inviter) = invited_by_name %}
    <span class="text-xs text-gray-500 dark:text-gray-400">invited by {{ inviter }}</span>
    {% endif %}
  </div>
  <div class="flex items-center gap-x-3 text-xs shrink-0">
    <button hx-post="/web/teams/{{ id }}/accept" hx-target="#page" hx-select="#page" hx-swap="innerHTML"
            class="cursor-pointer rounded-md bg-indigo-600 text-white px-2 py-1 hover:bg-indigo-500 dark:bg-indigo-500 dark:hover:bg-indigo-400">Accept</button>
    <button hx-post="/web/teams/{{ id }}/leave" hx-target="#page" hx-select="#page" hx-swap="innerHTML"
            class="cursor-pointer text-red-600 hover:text-red-500 dark:text-red-400 dark:hover:text-red-300">Decline</button>
  </div>
</li>
