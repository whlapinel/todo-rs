{% extends "base.html" %}
{% block title %}Events · Todo{% endblock %}
{% block content %}
<div class="space-y-6">
  <div class="md:flex md:items-center md:justify-between">
    <div class="min-w-0 flex-1">
      <h2 class="text-2xl/7 font-bold text-gray-900 sm:truncate sm:text-3xl sm:tracking-tight dark:text-white">Events
      </h2>
    </div>
  </div>

  <ul id="events-list"
    class="divide-y divide-gray-100 rounded-lg border border-gray-200 bg-white px-4 dark:divide-white/5 dark:border-white/10 dark:bg-gray-800/50">
    {% if rows.is_empty() %}
    <li class="py-3 text-sm text-gray-500 dark:text-gray-400">No events yet.</li>
    {% else %}
    {% for row in rows %}
    {{ row|safe }}
    {% endfor %}
    {% endif %}
  </ul>
</div>
{% endblock %}
