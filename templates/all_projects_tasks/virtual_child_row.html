<!-- One still-virtual sub-item of a series occurrence, nested under its parent's row on the
     cross-project Tasks list. See AllProjectsTaskVirtualChildRow. Deliberately has no Skip
     (there is no sub-item Skip) and no project tag — the parent row directly above it already
     carries one. -->
<li class="py-2">
  <div class="flex items-center gap-x-3">
    <input type="checkbox" hx-post="{{ complete_url }}"
      hx-target="#items-list" hx-select="unset" hx-swap="innerHTML"
      class="shrink-0 size-4 rounded border-gray-300 text-indigo-600 focus:ring-indigo-600 dark:border-white/20 dark:bg-white/5" />
    <!-- See project_calendar/virtual_row.html's doc comment on why the hx-get/target/select
         are explicit rather than inherited from body's hx-boost. -->
    <a href="{{ detail_url }}" hx-get="{{ detail_url }}" hx-target="#action-dialog"
      hx-select="#dialog-fragment" hx-swap="innerHTML"
      class="min-w-0 flex-1 truncate text-gray-900 dark:text-white">{{ name }}</a>
    <span class="shrink-0 text-[10px] uppercase tracking-wide font-semibold text-gray-400 dark:text-gray-500">Sub-item</span>
  </div>
  <div class="mt-1 flex items-center gap-x-3 pl-7 text-xs text-gray-500 dark:text-gray-400">
    <div class="flex min-w-0 flex-1 flex-wrap items-center gap-x-3 gap-y-1">
      {% if let Some(p) = priority_label %}
      <span class="text-amber-600 dark:text-amber-400">🚩 {{ p }}</span>
      {% endif %}
      <span class="{% if overdue %}text-red-600 dark:text-red-400{% endif %}">💀 {{ date_label }}</span>
    </div>
  </div>
</li>
