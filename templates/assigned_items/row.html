<li id="assigned-{{ id }}" class="flex items-center justify-between gap-x-3 py-2">
  <div class="flex items-center gap-x-3 min-w-0">
    <input type="checkbox" {% if complete %}checked{% endif %}
           hx-put="{{ detail_link }}" hx-vals='{"complete": "{{ toggle_complete_json }}"}'
           hx-target="#assigned-{{ id }}" hx-select="unset" hx-swap="outerHTML"
           class="shrink-0 size-4 rounded border-gray-300 text-indigo-600 focus:ring-indigo-600 dark:border-white/20 dark:bg-white/5" />
    <a href="{{ detail_link }}" hx-target="#page" hx-select="#page" hx-swap="innerHTML"
       class="truncate {% if complete %}line-through text-gray-400 dark:text-gray-500{% else %}text-gray-900 dark:text-white{% endif %}">{{ name }}</a>
  </div>
  {% if let Some(d) = due_date %}<span class="text-xs text-gray-500 shrink-0 dark:text-gray-400">{{ d }}</span>{% endif %}
</li>
