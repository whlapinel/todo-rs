{% extends "base.html" %}
{% block title %}Assigned to me · Todo{% endblock %}
{% block content %}
<div class="space-y-6">
  <h1 class="text-2xl font-semibold text-slate-900">Assigned to me</h1>
  <ul id="assigned-list" class="divide-y divide-slate-100 rounded-lg border border-slate-200 bg-white px-4">
    {% if rows.is_empty() %}
    <li class="py-3 text-sm text-slate-500">Nothing assigned to you.</li>
    {% else %}
    {% for row in rows %}
    {{ row|safe }}
    {% endfor %}
    {% endif %}
  </ul>
</div>
{% endblock %}
