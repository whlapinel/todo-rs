<header hx-boost="false"
  class="sticky top-0 z-40 border-b border-gray-200 bg-white dark:border-white/10 dark:bg-gray-900">
  <div class="mx-auto flex h-16 max-w-7xl items-center gap-x-4 px-4 sm:px-6 lg:px-8">
    <button type="button" onclick="document.getElementById('sidebar-mobile').classList.remove('hidden')"
      class="-m-2.5 p-2.5 text-gray-700 hover:text-gray-900 lg:hidden dark:text-gray-400 dark:hover:text-white">
      <span class="sr-only">Open sidebar</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true" class="size-6">
        <path d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </button>
    <button type="button" id="sidebar-toggle-btn" onclick="toggleSidebar()"
      class="hidden -m-2.5 p-2.5 text-gray-700 hover:text-gray-900 lg:flex dark:text-gray-400 dark:hover:text-white">
      <span class="sr-only">Toggle sidebar</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true" class="size-6">
        <path d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </button>
    <a href="/web/tasks" class="shrink-0 text-sm font-semibold text-gray-900 dark:text-white">Home</a>
    <nav class="flex flex-1 items-center gap-x-2 overflow-x-auto">
      {% for pill in project_pills %}
      <a href="{{ pill.href }}"
        class="shrink-0 rounded-full px-3 py-1 text-sm font-medium {% if pill.is_active %}bg-indigo-600 text-white{% else %}text-gray-600 hover:bg-gray-100 dark:text-gray-400 dark:hover:bg-white/5{% endif %}">{{
        pill.name }}</a>
      {% endfor %}
    </nav>
    <details class="relative shrink-0">
      <summary class="flex list-none cursor-pointer p-1.5 text-gray-500 hover:text-gray-900 dark:text-gray-400 dark:hover:text-white">
        <span class="sr-only">Notifications</span>
        <span class="relative">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true" class="size-6">
            <path d="M14.857 17.082a23.848 23.848 0 0 0 5.454-1.31A8.967 8.967 0 0 1 18 9.75V9A6 6 0 0 0 6 9v.75a8.967 8.967 0 0 1-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 0 1-5.714 0m5.714 0a3 3 0 1 1-5.714 0"
              stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <span id="notif-badge" hx-get="/web/notifications/badge" hx-trigger="load, every 30s, refresh-badge from:body"
                hx-target="this" hx-select="unset" hx-swap="innerHTML"></span>
        </span>
      </summary>
      <div hx-get="/web/notifications" hx-trigger="toggle from:closest details"
        hx-target="this" hx-select="unset" hx-swap="innerHTML"
        class="absolute right-0 z-50 mt-2 w-80 rounded-md border border-gray-200 bg-white shadow-lg dark:border-white/10 dark:bg-gray-800">
      </div>
    </details>
    <a href="/auth/logout"
      class="shrink-0 text-sm text-gray-600 hover:text-gray-900 dark:text-gray-400 dark:hover:text-white">Log out</a>
  </div>
</header>

<div id="sidebar-desktop" class="hidden lg:fixed lg:inset-y-0 lg:top-16 lg:left-0 lg:z-30 lg:flex lg:w-72 lg:flex-col">
  <div
    class="flex grow flex-col gap-y-5 overflow-y-auto border-r border-gray-200 bg-white pt-6 pb-4 dark:border-white/10 dark:bg-gray-900">
    {% include "nav_sidebar_inner.html" %}
  </div>
</div>

<div id="sidebar-mobile" hx-boost="false" class="hidden fixed inset-0 z-50 lg:hidden">
  <div class="fixed inset-0 bg-gray-900/80" onclick="document.getElementById('sidebar-mobile').classList.add('hidden')">
  </div>
  <div class="fixed inset-y-0 left-0 flex w-full max-w-xs flex-1">
    <div class="relative flex w-full flex-1 flex-col bg-white pt-6 pb-4 dark:bg-gray-900">
      <div class="flex items-center justify-between px-6 pb-4">
        <span class="text-sm font-semibold text-gray-900 dark:text-white">Menu</span>
        <button type="button" onclick="document.getElementById('sidebar-mobile').classList.add('hidden')"
          class="-m-2.5 p-2.5 text-gray-700 dark:text-gray-400">
          <span class="sr-only">Close sidebar</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"
            class="size-6">
            <path d="M6 18 18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
      </div>
      {% include "nav_sidebar_inner.html" %}
    </div>
  </div>
</div>
