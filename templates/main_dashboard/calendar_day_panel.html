{% if let Some(label) = selected_date_label %}
<h2 class="text-sm font-semibold text-gray-900 dark:text-white">{{ label }}</h2>
<ul class="mt-2 divide-y divide-gray-100 rounded-lg border border-gray-200 bg-white px-4 dark:divide-white/5 dark:border-white/10 dark:bg-gray-800/50">
  {% if day_rows.is_empty() %}
  <li class="py-3 text-sm text-gray-500 dark:text-gray-400">Nothing due or scheduled this day.</li>
  {% else %}
  {% for row in day_rows %}
  {{ row|safe }}
  {% endfor %}
  {% endif %}
</ul>
{% else %}
<p class="text-sm text-gray-500 dark:text-gray-400">Click a day above to see its full list.</p>
{% endif %}
