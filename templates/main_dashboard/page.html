{% extends "base.html" %}
{% block title %}Calendar · Todo{% endblock %}
{% block content %}
<div class="space-y-6">
  <div class="md:flex md:items-center md:justify-between">
    <div class="min-w-0 flex-1">
      <h2 class="text-2xl/7 font-bold text-gray-900 sm:truncate sm:text-3xl sm:tracking-tight dark:text-white">Calendar
      </h2>
    </div>
    <div class="mt-4 flex items-center gap-x-4 md:mt-0 md:ml-4">
      <label class="text-sm text-gray-700 dark:text-gray-300">View
        <select name="preset"
          class="ml-1 rounded-md bg-white px-2 py-1 text-sm text-gray-900 outline-1 -outline-offset-1 outline-gray-300 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-600 dark:bg-white/5 dark:text-white dark:outline-white/10 dark:*:bg-gray-800 dark:focus:outline-indigo-500"
          hx-get="/web/dashboard/list" hx-trigger="change" hx-target="#page" hx-select="#page"
          hx-swap="innerHTML" hx-push-url="true" hx-include="[name='showComplete']">
          {% for entry in presets %}
          <option value="{{ entry.0 }}" {% if entry.1 %}selected{% endif %}>{{ entry.0 }}</option>
          {% endfor %}
        </select>
      </label>
      <label class="text-sm text-gray-600 flex items-center gap-x-1 dark:text-gray-400">
        <input type="checkbox" name="showComplete" value="1" {% if show_complete %}checked{% endif %}
          hx-get="/web/dashboard/list" hx-trigger="change" hx-target="#page" hx-select="#page"
          hx-swap="innerHTML" hx-push-url="true" hx-include="[name='preset']"
          class="size-4 rounded border-gray-300 text-indigo-600 focus:ring-indigo-600 dark:border-white/20 dark:bg-white/5" />
        Show completed
      </label>
      <a href="/web/dashboard" hx-target="#page" hx-select="#page"
        hx-swap="innerHTML"
        class="inline-flex items-center justify-center rounded-md bg-white px-3 py-2 text-sm font-semibold text-gray-900 shadow-xs inset-ring inset-ring-gray-300 hover:bg-gray-50 dark:bg-white/10 dark:text-white dark:shadow-none dark:inset-ring-white/5 dark:hover:bg-white/20">Calendar
        view</a>
    </div>
  </div>

  <ul id="main-dashboard-list"
    class="divide-y divide-gray-100 rounded-lg border border-gray-200 bg-white px-4 dark:divide-white/5 dark:border-white/10 dark:bg-gray-800/50">
    {% if rows.is_empty() %}
    <li class="py-3 text-sm text-gray-500 dark:text-gray-400">Nothing to show.</li>
    {% else %}
    {% for row in rows %}
    {{ row|safe }}
    {% endfor %}
    {% endif %}
  </ul>
</div>
{% endblock %}
