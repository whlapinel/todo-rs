{% import "macros.html" as macros %}
<!-- Stage 2 of docs/dialog-item-forms-plan.md: this fragment is both (a) swapped whole into
     base.html's persistent #action-dialog (via #dialog-fragment, the conventional wrapper id
     every new/edit/detail dialog fragment uses) when opened from a row's "⋮ Edit" or the
     detail dialog's own Edit button, and (b) embedded directly by edit_page.html for
     direct-URL/bookmark access — see that template's own auto-open script. No <dialog> tag of
     its own; base.html's #action-dialog supplies that. -->
<div id="dialog-fragment">
  <div id="dialog-backdrop"
    class="fixed inset-0 bg-gray-500/75 dark:bg-gray-900/50 transition-opacity duration-300 ease-out opacity-0 group-open/dialog:opacity-100">
  </div>
  <div tabindex="0"
    class="relative z-10 flex min-h-full items-end justify-center p-4 text-center focus:outline-none sm:items-center sm:p-0">
    <div class="relative transform overflow-hidden rounded-lg bg-white dark:bg-gray-800 px-4 pt-5 pb-4 text-left shadow-xl transition-all duration-300 ease-out translate-y-4 opacity-0 scale-95 group-open/dialog:translate-y-0 group-open/dialog:opacity-100 group-open/dialog:scale-100 sm:my-8 sm:w-full sm:max-w-lg sm:p-6 dark:outline dark:-outline-offset-1 dark:outline-white/10">
      <div id="item-{{ id }}-fields" class="space-y-3">
        <!-- Two save-target shapes, depending on where this dialog was opened from (see
             `ProjectSimpleItemDetailFields.via_full_page`'s doc comment):
             - From a list row's "⋮ Edit"/detail dialog Edit button (`via_full_page == false`,
               the default): submits in place against the row on whatever list page is
               underneath this dialog (hx-select="#item-{{ id }}" plucks just the row out of
               update_project_simple_item_form's row+fields response).
             - From the item's own full detail page's Edit link (`via_full_page == true`):
               there's no `#item-{{ id }}` row on that page to target, so the form instead
               carries a hidden `redirect=1` (mirroring every other create/update form's
               redirect convention) and targets `#page`, which `update_project_simple_item_form`'s
               `close` branch re-renders as the full, freshly-saved detail page.
             Saving from a direct-URL-loaded edit page with neither list page nor detail page
             underneath (bookmark/typed URL, no `redirect=1`) is a known, accepted gap — see the
             plan doc's Stage 1 "Submit behavior" notes.

             A saved edit can also change where this item sorts in the list underneath the
             dialog (e.g. completing it), which the row-swap the `via_full_page == false` branch
             does can't reflect since it only replaces this one row in place. Re-fetching the
             page underneath afterward (its URL, including any applied filters, is unchanged by
             the dialog being open) is the simple fix over conditionally detecting which fields
             actually affect order. -->
        <form hx-put="/web/projects/{{ project_id }}/simple-lists/{{ id }}"
          {% if via_full_page %}
          hx-target="#page" hx-select="#page" hx-swap="innerHTML"
          hx-on::after-request="if(event.detail.successful) document.getElementById('action-dialog').close()"
          {% else %}
          hx-target="#item-{{ id }}" hx-select="#item-{{ id }}" hx-swap="outerHTML"
          hx-on::after-request="if(event.detail.successful) { document.getElementById('action-dialog').close(); htmx.ajax('GET', window.location.href, {target: '#page', select: '#page', swap: 'innerHTML'}); }"
          {% endif %}
          class="space-y-3">
          {% if via_full_page %}
          <input type="hidden" name="redirect" value="1" />
          {% endif %}
          <h3 class="text-base font-semibold text-gray-900 dark:text-white">Edit item</h3>
          <label class="block text-sm/6 font-medium text-gray-900 dark:text-white">Name <span
              class="text-red-500" aria-hidden="true">*</span>
            <div class="mt-2">
              <input type="text" name="name" value="{{ name }}" required maxlength="200"
                class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-600 sm:text-sm/6 dark:bg-white/5 dark:text-white dark:outline-white/10 dark:placeholder:text-gray-500 dark:focus:outline-indigo-500" />
            </div>
          </label>
          {% call macros::description_field(description) %}{% endcall %}
          <div class="mt-5 sm:mt-6 sm:grid sm:grid-flow-row-dense sm:grid-cols-2 sm:gap-3">
            <button type="submit"
              class="inline-flex w-full justify-center rounded-md bg-indigo-600 px-3 py-2 text-sm font-semibold text-white shadow-xs hover:bg-indigo-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600 sm:col-start-2 dark:bg-indigo-500 dark:shadow-none dark:hover:bg-indigo-400 dark:focus-visible:outline-indigo-500">Save</button>
            <button type="button" onclick="document.getElementById('action-dialog').close()"
              class="mt-3 inline-flex w-full justify-center rounded-md bg-white px-3 py-2 text-sm font-semibold text-gray-900 shadow-xs inset-ring-1 inset-ring-gray-300 hover:bg-gray-50 sm:col-start-1 sm:mt-0 dark:bg-white/10 dark:text-white dark:shadow-none dark:inset-ring-white/5 dark:hover:bg-white/20">Cancel</button>
          </div>
          {% if just_saved %}
          <span class="toast-fade text-sm text-green-600">&#10003; Saved</span>
          {% endif %}
        </form>
      </div>
    </div>
  </div>
</div>
