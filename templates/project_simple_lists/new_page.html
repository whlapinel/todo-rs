{% extends "base.html" %}
{% import "macros.html" as macros %}
{% block title %}New item · Todo{% endblock %}
{% block content %}
<!-- Stage 2 of docs/dialog-item-forms-plan.md: this "page" is now just a dialog fragment (for
     the trigger buttons that hx-get it into #action-dialog) plus the standalone batch-create
     section, which stays a plain page section — same shape as project_tasks/new_page.html's
     Stage 1 precedent. #dialog-fragment is the conventional wrapper id every new/edit/detail
     dialog fragment uses; direct-URL access (bookmarks, non-JS) is handled by the inline
     script below, which moves this fragment's own children into base.html's persistent
     #action-dialog and opens it — see Decision 3. -->
<div id="dialog-fragment">
  <div id="dialog-backdrop"
    class="fixed inset-0 bg-gray-500/75 dark:bg-gray-900/50 transition-opacity duration-300 ease-out opacity-0 group-open/dialog:opacity-100">
  </div>
  <div tabindex="0"
    class="relative z-10 flex min-h-full items-end justify-center p-4 text-center focus:outline-none sm:items-center sm:p-0">
    <div class="relative transform overflow-hidden rounded-lg bg-white dark:bg-gray-800 px-4 pt-5 pb-4 text-left shadow-xl transition-all duration-300 ease-out translate-y-4 opacity-0 scale-95 group-open/dialog:translate-y-0 group-open/dialog:opacity-100 group-open/dialog:scale-100 sm:my-8 sm:w-full sm:max-w-lg sm:p-6 dark:outline dark:-outline-offset-1 dark:outline-white/10">
      <!-- Targets #items-list on whatever Simple Lists page is underneath this dialog — same
           known, accepted gap as detail_fields.html's edit form: creating from a direct-URL-
           loaded /simple-lists/new (no list page underneath, so no #items-list to find) is not
           handled specially. -->
      <form hx-post="/web/projects/{{ project_id }}/simple-lists" hx-target="#items-list" hx-select="unset"
        hx-swap="innerHTML"
        hx-on::after-request="if(event.detail.successful) document.getElementById('action-dialog').close()"
        class="space-y-3">
        <h3 class="text-base font-semibold text-gray-900 dark:text-white">New item</h3>
        <div class="mt-3 text-left space-y-3">
          <input type="text" name="name" placeholder="New item *" required maxlength="200"
            class="flex-1 w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-600 sm:text-sm/6 dark:bg-white/5 dark:text-white dark:outline-white/10 dark:placeholder:text-gray-500 dark:focus:outline-indigo-500" />
        </div>
        <div class="mt-5 sm:mt-6 sm:grid sm:grid-flow-row-dense sm:grid-cols-2 sm:gap-3">
          <button type="submit"
            class="inline-flex w-full justify-center rounded-md bg-indigo-600 px-3 py-2 text-sm font-semibold text-white shadow-xs hover:bg-indigo-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600 sm:col-start-2 dark:bg-indigo-500 dark:shadow-none dark:hover:bg-indigo-400 dark:focus-visible:outline-indigo-500">Add
            item</button>
          <button type="button" onclick="document.getElementById('action-dialog').close()"
            class="mt-3 inline-flex w-full justify-center rounded-md bg-white px-3 py-2 text-sm font-semibold text-gray-900 shadow-xs inset-ring-1 inset-ring-gray-300 hover:bg-gray-50 sm:col-start-1 sm:mt-0 dark:bg-white/10 dark:text-white dark:shadow-none dark:inset-ring-white/5 dark:hover:bg-white/20">Cancel</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Direct-URL/bookmark access only (Decision 3) — an htmx-triggered open already selected
     just #dialog-fragment out of this response, so this sibling <script> is never part of
     what gets swapped in that path; it only runs on an actual full-page load. Moves (not
     copies) #dialog-fragment's children into base.html's persistent #action-dialog so nothing
     inert is left behind in #page once the dialog is showing. -->
<script>
  (function () {
    var dialog = document.getElementById('action-dialog');
    var frag = document.getElementById('dialog-fragment');
    if (dialog && frag && !dialog.open) {
      while (frag.firstChild) dialog.appendChild(frag.firstChild);
      frag.remove();
      htmx.process(dialog);
      dialog.showModal();
    }
  })();
</script>

<div class="max-w-lg mx-auto mt-8">
  <details class="rounded-lg border border-gray-200 bg-white p-4 dark:border-white/10 dark:bg-gray-800/50">
    <summary class="text-sm text-gray-700 cursor-pointer dark:text-gray-300">Add multiple at once</summary>
    <form hx-post="/web/projects/{{ project_id }}/simple-lists/batch" hx-target="#page" hx-select="#page" hx-swap="innerHTML" class="mt-3 space-y-2">
      <input type="hidden" name="redirect" value="1" />
      <textarea name="names" rows="4" placeholder="One item per line"
                class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-600 sm:text-sm/6 dark:bg-white/5 dark:text-white dark:outline-white/10 dark:placeholder:text-gray-500 dark:focus:outline-indigo-500"></textarea>
      {% call macros::button_primary("Add all") %}{% endcall %}
    </form>
  </details>
</div>
{% endblock %}
