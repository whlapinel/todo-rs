<!-- Stage 2 of docs/dialog-item-forms-plan.md — the read-only detail dialog (Decision 1),
     mirroring project_tasks/detail_dialog.html's shape. Simple items have no `view` partial to
     wrap (unlike Tasks/Events — see ProjectSimpleItemDetailPageTemplate, which never had a
     `view: String` field), so this fragment inlines the description directly rather than
     embedding a pre-rendered sub-template — matching detail_page.html's own existing plain
     `<p>`-only style rather than inventing a `<dl>` this screen never had. No complete-toggle
     gating on Edit — Simple items have no complete concept at all.

     No "View full page" link here (2026-08-25 revision, see docs/item-detail-full-page-
     retirement.md) — a prior revision had one, closed via `hx-on::after-request` to dodge a
     race with detail_page.html's own auto-open script. That race, and the "two dialogs stacked"
     bug it eventually caused, is gone by construction now: full-page access lives only in the
     row's action popover (components/row_actions_menu.html's "View full page" entry), which is
     never reachable while this modal `<dialog>` is open (a modal blocks all clicks outside
     itself), and detail_page.html no longer auto-opens a dialog on load at all. So there is no
     longer any path that navigates away while this dialog is still open — the only ways out are
     Edit, Close, or browser back (handled separately, see base.html's `htmx:historyCacheHit`
     listener). -->
<div id="dialog-fragment">
  <div id="dialog-backdrop"
    class="fixed inset-0 bg-gray-500/75 dark:bg-gray-900/50 transition-opacity duration-300 ease-out opacity-0 group-open/dialog:opacity-100">
  </div>
  <div tabindex="0"
    class="relative z-10 flex min-h-full items-end justify-center p-4 text-center focus:outline-none sm:items-center sm:p-0">
    <div class="relative transform overflow-hidden rounded-lg bg-white dark:bg-gray-800 px-4 pt-5 pb-4 text-left shadow-xl transition-all duration-300 ease-out translate-y-4 opacity-0 scale-95 group-open/dialog:translate-y-0 group-open/dialog:opacity-100 group-open/dialog:scale-100 sm:my-8 sm:w-full sm:max-w-lg sm:p-6 dark:outline dark:-outline-offset-1 dark:outline-white/10">
      <h3 class="mb-3 text-base font-semibold text-gray-900 dark:text-white">{{ name }}</h3>
      {% if let Some(d) = description %}
      <p class="text-sm whitespace-pre-wrap text-gray-700 dark:text-gray-300">{{ d }}</p>
      {% endif %}
      <div class="mt-5 sm:mt-6 flex flex-wrap items-center gap-3">
        <button type="button" hx-get="{{ edit_url }}" hx-target="#action-dialog" hx-select="#dialog-fragment"
          hx-swap="innerHTML"
          class="inline-flex items-center justify-center rounded-md bg-indigo-600 px-3 py-2 text-sm font-semibold text-white shadow-xs hover:bg-indigo-500 dark:bg-indigo-500 dark:shadow-none dark:hover:bg-indigo-400">Edit</button>
        <button type="button" onclick="document.getElementById('action-dialog').close()"
          class="ml-auto inline-flex items-center justify-center rounded-md bg-white px-3 py-2 text-sm font-semibold text-gray-900 shadow-xs inset-ring-1 inset-ring-gray-300 hover:bg-gray-50 dark:bg-white/10 dark:text-white dark:shadow-none dark:inset-ring-white/5 dark:hover:bg-white/20">Close</button>
      </div>
    </div>
  </div>
</div>
