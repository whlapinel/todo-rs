{% extends "base.html" %}
{% block title %}Edit {{ name }} · Todo{% endblock %}
{% block content %}
{{ fields|safe }}
<!-- Direct-URL/bookmark access only (Decision 3 of docs/dialog-item-forms-plan.md) — an
     htmx-triggered open already selected just #dialog-fragment (embedded above via `fields`)
     out of this response, so this sibling <script> is never part of what gets swapped in that
     path; it only runs on an actual full-page load. Moves (not copies) #dialog-fragment's
     children into base.html's persistent #action-dialog so nothing inert is left behind in
     #page once the dialog is showing. -->
<script>
  (function () {
    function open() {
      var dialog = document.getElementById('action-dialog');
      var frag = document.getElementById('dialog-fragment');
      if (dialog && frag && !dialog.open) {
        dialog.innerHTML = '';
        while (frag.firstChild) dialog.appendChild(frag.firstChild);
        frag.remove();
        htmx.process(dialog);
        dialog.showModal();
        focusDialogContent(dialog);
      }
    }
    if (document.getElementById('action-dialog')) {
      open();
    } else {
      // See project_tasks/edit_page.html's identical script for why this fallback
      // (and the focusDialogContent call above) exist.
      document.addEventListener('DOMContentLoaded', open);
    }
  })();
</script>
{% endblock %}
