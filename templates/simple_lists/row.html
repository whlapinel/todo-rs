<li id="item-{{ id }}" class="py-2">
  <div class="flex items-center gap-x-3">
    <a href="/web/simple-lists/{{ id }}" hx-target="#page" hx-select="#page" hx-swap="innerHTML"
       class="min-w-0 flex-1 truncate text-gray-900 dark:text-white">
      {% if has_children %}<span class="text-gray-400 dark:text-gray-500">&#9656;</span>{% endif %} {{ name }}
    </a>
  </div>
  <div class="mt-1 flex items-center justify-end gap-x-3 pl-7 text-xs text-gray-500 dark:text-gray-400">
    {% if !siblings.is_empty() %}
    <select name="new_parent_id"
            hx-post="/web/simple-lists/{{ id }}/subordinate" hx-trigger="change"
            hx-target="#page" hx-select="#page" hx-swap="innerHTML" hx-push-url="true"
            class="shrink-0 rounded-md border-0 bg-white py-1 pl-2 pr-6 text-xs text-gray-700 ring-1 ring-inset ring-gray-300 focus:ring-2 focus:ring-indigo-600 dark:bg-white/5 dark:text-gray-300 dark:ring-white/10">
      <option value="" selected disabled>Move under…</option>
      {% for s in siblings %}<option value="{{ s.0 }}">{{ s.1 }}</option>{% endfor %}
    </select>
    {% endif %}
    <button hx-delete="/web/simple-lists/{{ id }}"
            hx-confirm="Delete {{ name }}{% if has_children %} and all its sub-items{% endif %}?"
            hx-target="#item-{{ id }}" hx-select="unset" hx-swap="outerHTML swap:200ms"
            class="shrink-0 cursor-pointer text-red-600 hover:text-red-500 dark:text-red-400 dark:hover:text-red-300">Delete</button>
  </div>
</li>
