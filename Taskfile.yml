version: "3"

tasks:
  codegen:
    desc: Generate the Rust server SDK from the Smithy model
    cmds:
      - ./gradlew :model:assemble
    sources:
      - model/src/main/smithy/**/*.smithy
      - model/smithy-build.json
      - model/build.gradle.kts
    generates:
      - todo-server-sdk/src/**/*.rs
      - todo-client/src/**/*.rs
      - todo-typescript-client/

  web-styles:
    desc: Build Tailwind CSS and vendor htmx.min.js for the web_ui templates (outputs to static/)
    dir: styles
    cmds:
      - npm install
      - npm run build
    sources:
      - input.css
      - package.json
      - ../templates/**/*.html
    generates:
      - ../static/style.css
      - ../static/js/htmx.min.js

  build:
    desc: Build everything (codegen + server)
    cmds:
      - task: codegen
      - task: web-styles
      - cargo build

  run:
    dotenv:
      - .env
    desc: Build and run the server
    cmds:
      - task: codegen
      - task: web-styles
      - cargo run

  check:
    desc: Type-check without producing a binary
    deps: [codegen]
    cmds:
      - cargo check

  docker-build:
    desc: Build the Docker image (runs codegen first — Dockerfile needs generated files)
    cmds:
      - task: codegen
      - docker build -t whlapinel/todo:latest .

  docker-push:
    desc: Push the Docker image to Docker Hub
    cmds:
      - docker push whlapinel/todo:latest

  docker-release:
    desc: codegen + docker build + push
    cmds:
      - task: docker-build
      - task: docker-push

  cli-build:
    desc: Build the prl CLI binary
    dir: todo-cli
    cmds:
      - cargo build --release
    sources:
      - src/**/*.rs
    generates:
      - target/release/prl

  cli-install:
    desc: Install the prl CLI to ~/.cargo/bin
    dir: todo-cli
    cmds:
      - cargo install --path .

  clean:
    desc: Remove all build artifacts
    cmds:
      - cargo clean
      - rm -rf todo-server-sdk
      - rm -rf model/build
      - rm -rf build
