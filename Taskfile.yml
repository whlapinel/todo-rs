version: "3"

tasks:
  codegen:
    desc: Generate the Rust server SDK from the Smithy model
    cmds:
      - ./gradlew :model:assemble
    sources:
      - model/src/main/smithy/**/*.smithy
      - model/smithy-build.json
      - model/build.gradle.kts
    generates:
      - todo-server-sdk/src/**/*.rs
      - todo-client/src/**/*.rs
      - todo-typescript-client/

  client:
    desc: Build the generated TypeScript client package
    dir: todo-typescript-client
    cmds:
      - npm install
      - npm run build
    sources:
      - src/**/*.ts
    generates:
      - dist-cjs/**/*
      - dist-es/**/*
      - dist-types/**/*

  frontend:
    desc: Build the frontend (outputs to frontend/dist/)
    dir: frontend
    deps: [client]
    cmds:
      - npm install
      - npm run build
    sources:
      - src/**/*.ts
      - index.html
    generates:
      - dist/**/*

  build:
    desc: Build everything (codegen + frontend + server)
    cmds:
      - task: codegen
      - task: frontend
      - cargo build

  run:
    desc: Build and run the server
    cmds:
      - task: codegen
      - task: frontend
      - cargo run

  check:
    desc: Type-check without producing a binary
    deps: [codegen]
    cmds:
      - cargo check

  docker-build:
    desc: Build the Docker image
    cmds:
      - docker build -t whlapinel/todo:latest .

  docker-push:
    desc: Push the Docker image to Docker Hub
    cmds:
      - docker push whlapinel/todo:latest

  docker-release:
    desc: Build and push the Docker image
    cmds:
      - task: docker-build
      - task: docker-push

  cli-build:
    desc: Build the prl CLI binary
    dir: todo-cli
    cmds:
      - cargo build --release
    sources:
      - src/**/*.rs
    generates:
      - target/release/prl

  cli-install:
    desc: Install the prl CLI to ~/.cargo/bin
    dir: todo-cli
    cmds:
      - cargo install --path .

  clean:
    desc: Remove all build artifacts
    cmds:
      - cargo clean
      - rm -rf todo-server-sdk
      - rm -rf model/build
      - rm -rf build
