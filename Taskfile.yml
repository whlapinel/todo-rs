version: "3"

tasks:
  codegen:
    desc: Generate the Rust server SDK from the Smithy model
    cmds:
      - ./gradlew :model:assemble
    sources:
      - model/src/main/smithy/**/*.smithy
      - model/smithy-build.json
      - model/build.gradle.kts
    generates:
      - todo-server-sdk/src/**/*.rs
      - todo-client/src/**/*.rs
      - todo-typescript-client/

  web-styles:
    desc: Build Tailwind CSS, vendor htmx.min.js, and copy PWA assets for the web_ui templates (outputs to static/)
    dir: styles
    cmds:
      - npm install
      - npm run build
    sources:
      - input.css
      - package.json
      - ../templates/**/*.html
      - ../pwa-assets/**
    generates:
      - ../static/style.css
      - ../static/js/htmx.min.js
      - ../static/manifest.json
      - ../static/sw.js

  build:
    desc: Build everything (codegen + server)
    cmds:
      - task: codegen
      - task: web-styles
      - cargo build

  copy-prod-db:
    desc: Copies prod db (plus its WAL) to repo for testing
    vars:
      REMOTE: daddy@lapinel-fam.club
      DIR: /opt/home-server-data/todo-data
    cmds:
      # Prod runs SQLite in WAL mode: recent writes sit in todo.db-wal until a checkpoint, so
      # copying todo.db alone can be hours stale. A leftover local -wal/-shm would be replayed
      # onto the fresh copy, so those go first. The -shm is never copied — SQLite rebuilds it
      # from the WAL on open. (No sqlite3 on the server, so no `.backup` snapshot.)
      - rm -f todo.db-wal todo.db-shm
      - scp {{.REMOTE}}:{{.DIR}}/todo.db .
      - if ssh {{.REMOTE}} test -f {{.DIR}}/todo.db-wal; then scp {{.REMOTE}}:{{.DIR}}/todo.db-wal .; fi

  run:
    dotenv:
      - .env
    desc: Build and run the server
    cmds:
      - task: codegen
      - task: web-styles
      - cargo run

  check:
    desc: Type-check without producing a binary
    deps: [codegen]
    cmds:
      - cargo check

  docker-build:
    desc: Build the Docker image (runs codegen first — Dockerfile needs generated files)
    cmds:
      - task: codegen
      - docker build -t whlapinel/todo:latest .

  docker-push:
    desc: Push the Docker image to Docker Hub
    cmds:
      - docker push whlapinel/todo:latest

  docker-release:
    desc: codegen + docker build + push
    cmds:
      - task: docker-build
      - task: docker-push

  cli-build:
    desc: Build the prl CLI binary
    dir: todo-cli
    cmds:
      - cargo build --release
    sources:
      - src/**/*.rs
    generates:
      - target/release/prl

  cli-install:
    desc: Install the prl CLI to ~/.cargo/bin
    dir: todo-cli
    cmds:
      - cargo install --path .

  clean:
    desc: Remove all build artifacts
    cmds:
      - cargo clean
      - rm -rf todo-server-sdk
      - rm -rf model/build
      - rm -rf build
