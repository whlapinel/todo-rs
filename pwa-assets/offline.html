<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline - PRL</title>
  <link rel="stylesheet" href="/web/static/style.css" />
</head>

<body class="bg-gray-50 text-gray-900 dark:bg-gray-900 dark:text-white">
  <div class="max-w-md mx-auto px-4 py-24 text-center">
    <img src="/web/static/icons/icon-192.png" alt="" class="w-16 h-16 mx-auto mb-6 rounded-xl" />
    <h1 class="text-xl font-semibold mb-2">You're offline</h1>
    <p class="text-gray-500 dark:text-gray-400 mb-6">
      PRL needs a connection to load your tasks. Check your connection and try again.
    </p>
    <button onclick="location.reload()"
      class="inline-flex items-center rounded-md bg-indigo-600 px-3.5 py-2 text-sm font-semibold text-white shadow-sm hover:bg-indigo-500">
      Retry
    </button>
  </div>
</body>

</html>
